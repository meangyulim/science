<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물리 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="kit/lab.css">
<style>
/* Layout: 모눈종이 머리판(제목 + 개념 158칸 지도) → 붙어 다니는 과목 탭·찾기 띠 → 대단원 띠(로마 숫자·진행 막대)
   → 단원마다 실험 카드(무대 그림). 대단원 색: Ⅰ 역학 = 파랑, Ⅱ 전자기 = 보라, Ⅲ 파동 = 초록 (실험 페이지의 물리량 색과 같은 계열) */
:root{
  --u1:#2463c7; --u1-soft:rgba(36,99,199,.10);
  --u2:#7a52c7; --u2-soft:rgba(122,82,199,.11);
  --u3:#1f8a55; --u3-soft:rgba(31,138,85,.10);
  --cell-off:#dde1e7; --hero-grid:rgba(17,24,39,.055); --lift:rgba(17,24,39,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --u1:#62a8ff; --u1-soft:rgba(98,168,255,.14);
    --u2:#ab8cf5; --u2-soft:rgba(171,140,245,.15);
    --u3:#4fc58b; --u3-soft:rgba(79,197,139,.14);
    --cell-off:#283040; --hero-grid:rgba(255,255,255,.05); --lift:rgba(0,0,0,.45);
  }
  :root:not([data-theme="light"]) .h-thumb .lt{display:none}
  :root:not([data-theme="light"]) .h-thumb .dk{display:block}
}
:root[data-theme="dark"]{
  --u1:#62a8ff; --u1-soft:rgba(98,168,255,.14);
  --u2:#ab8cf5; --u2-soft:rgba(171,140,245,.15);
  --u3:#4fc58b; --u3-soft:rgba(79,197,139,.14);
  --cell-off:#283040; --hero-grid:rgba(255,255,255,.05); --lift:rgba(0,0,0,.45);
}
:root[data-theme="dark"] .h-thumb .lt{display:none}
:root[data-theme="dark"] .h-thumb .dk{display:block}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.page{max-width:1240px}
.c1{--u:var(--u1);--u-soft:var(--u1-soft)}
.c2{--u:var(--u2);--u-soft:var(--u2-soft)}
.c3{--u:var(--u3);--u-soft:var(--u3-soft)}

/* 머리판 */
.h-top{padding-block:18px 0;display:grid;gap:12px}
.h-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 48px;align-items:center;padding:34px 36px;border:1px solid var(--line);border-radius:26px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--hero-grid) 1px,transparent 1px),linear-gradient(90deg,var(--hero-grid) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
.h-kicker{display:flex;gap:8px;align-items:center;font:600 12.5px/1 var(--font-num);letter-spacing:.14em;color:var(--copper)}
.h-beta{font:700 11px/1 var(--font-num);letter-spacing:.06em;padding:4px 7px;border-radius:999px;background:var(--copper);color:var(--on-copper)}
.h-hero h1{margin:12px 0 0;font-size:clamp(44px,6.4vw,72px);line-height:1.02}
.h-lead{margin:14px 0 0;font-size:17px;line-height:1.65;color:var(--muted);max-width:30ch}
.h-count{margin-top:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.h-count b{font:600 40px/1 var(--font-num);color:var(--ink);letter-spacing:-.02em}
.h-count b span{color:var(--muted);font-size:22px}
.h-count em{font-style:normal;font-size:14.5px;color:var(--muted)}
/* 공식 지도로 가는 입구 (physics/formulas/) */
.h-fmap{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:10px 16px 10px 12px;border-radius:14px;border:1px solid var(--copper);background:var(--copper-soft);color:var(--copper-ink);text-decoration:none;font-size:15.5px;font-weight:700;line-height:1.3}
.h-fmap svg{width:26px;height:26px;flex:none}
.h-fmap small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-2)}
.h-fmap:hover{background:var(--copper);color:var(--on-copper)}
.h-fmap:hover small{color:inherit}

/* 개념 지도: 한 칸 = 개념 하나 */
.h-map{--cell:13px;display:grid;gap:18px;justify-items:start}
.h-row{display:grid;gap:8px}
.h-row > span{font-size:13.5px;font-weight:800}
.h-groups{display:flex;gap:16px;align-items:flex-start}
.h-grp{display:grid;gap:7px}
.h-cells{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));gap:3px}
.h-cells > *{display:block;width:var(--cell);height:var(--cell);border-radius:3px;background:var(--cell-off)}
.h-cells a{background:var(--u);transition:transform .12s}
.h-cells a:hover,.h-cells a:focus-visible{transform:scale(1.45);outline:2px solid var(--paper);outline-offset:0;position:relative;z-index:1}
.h-grp small{font-size:12px;line-height:1.3;color:var(--muted);max-width:calc(var(--cols) * (var(--cell) + 3px))}
.h-grp small b{font:600 11.5px var(--font-num);color:var(--u)}
.h-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.h-key i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--cell-off)}
.h-key i.on{background:linear-gradient(90deg,var(--u1) 33%,var(--u2) 33% 66%,var(--u3) 66%)}

/* 과목 탭·찾기 */
.h-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:18px;padding-block:10px;display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;background:var(--bg)}
.h-tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.h-tabs button{border:0;background:none;cursor:pointer;padding:9px 16px;border-radius:10px;font-size:15.5px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.h-tabs button small{font:600 12px var(--font-num)}
.h-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.h-search{position:relative;flex:1 1 240px;min-width:0}
.h-search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.h-search input{width:100%;height:46px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.h-search input::placeholder{color:var(--muted)}
.h-search input:focus{outline:2px solid var(--copper);outline-offset:1px}

/* 대단원 */
.h-bu{margin-top:30px}
.h-bu-head{display:flex;gap:16px;align-items:center;padding-bottom:14px;border-bottom:2px solid var(--u)}
.h-num{font:600 40px/1 var(--font-num);letter-spacing:-.06em;color:var(--u);min-width:1.6em;text-align:center}
.h-bu-head h2{margin:0;font-size:clamp(20px,2.4vw,24px);font-weight:800;letter-spacing:-.01em;line-height:1.3}
.h-prog{display:flex;align-items:center;gap:10px;margin-top:6px}
.h-prog i{display:block;width:150px;height:7px;border-radius:99px;background:var(--cell-off);overflow:hidden}
.h-prog i span{display:block;height:100%;background:var(--u);border-radius:inherit}
.h-prog b{font:600 13px var(--font-num);color:var(--muted)}
.h-unit{margin-top:20px}
.h-unit h3{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.h-unit h3 a{color:inherit;text-decoration:none;border-bottom:2px solid var(--u-soft)}
.h-unit h3 a:hover{border-bottom-color:var(--u)}
.h-unit h3 small{font:600 12.5px var(--font-num);color:var(--muted)}

/* 실험 카드 */
.h-cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.h-card{display:grid;grid-template-rows:auto auto auto 1fr;height:100%;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  color:inherit;text-decoration:none;transition:transform .16s,border-color .16s,box-shadow .16s}
.h-card:hover{transform:translateY(-3px);border-color:var(--u);box-shadow:0 12px 26px var(--lift)}
.h-card:focus-visible{outline:3px solid var(--u);outline-offset:2px}
.h-thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--u-soft);border-bottom:1px solid var(--line-soft)}
.h-thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.h-thumb .dk{display:none}
.h-thumb.none img{display:none!important}
.h-thumb.none::after{content:attr(data-id);position:absolute;inset:0;display:grid;place-items:center;font:600 20px var(--font-num);color:var(--u)}
.h-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:13px 15px 0}
.h-id{font:600 12px var(--font-num);color:var(--u);background:var(--u-soft);padding:2px 8px;border-radius:999px}
.h-tag{font:700 11px var(--font-num);padding:2px 7px;border-radius:999px;background:var(--copper);color:var(--on-copper)}
.h-name{padding:7px 15px 0;font-size:17px;line-height:1.4;font-weight:800;letter-spacing:-.01em}
.h-q{padding:5px 15px 0;margin-bottom:15px;font-size:14px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 준비 중 */
.h-soon{margin-top:12px}
.h-soon summary{cursor:pointer;width:max-content;font-size:14px;font-weight:700;color:var(--muted)}
.h-soon summary:hover{color:var(--ink)}
.h-soon ol,.h-plain{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px 20px}
.h-soon li,.h-plain li{font-size:14.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;min-width:0}
.h-soon li b,.h-plain li b{font:600 12px var(--font-num);color:var(--u);flex:none}
.h-bu.quiet .h-bu-head{border-bottom-width:1px;border-bottom-color:var(--line)}
.h-bu.quiet .h-unit{margin-top:14px}
.h-bu.quiet .h-unit h3{margin:0;font-size:15.5px;color:var(--muted)}
.h-note{margin:18px 0 0;padding:14px 16px;border-radius:14px;background:var(--paper);border:1px dashed var(--line);color:var(--muted);font-size:15px}
.h-found{margin-top:24px}
.h-found h2{margin:0 0 14px;font-size:18px;font-weight:800}
.h-found .h-plain{margin-top:16px}
.h-found .h-plain li{color:var(--muted)}
.h-found .h-plain li em{font-style:normal;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 7px;flex:none}

@media (max-width:900px){
  .h-hero{grid-template-columns:minmax(0,1fr);padding:28px 26px}
  .h-lead{max-width:44ch}
}
@media (max-width:600px){
  .h-hero{padding:22px 18px;border-radius:20px}
  .h-map{--cell:10px}
  .h-groups{gap:12px}
  .h-bar{gap:8px}
  .h-tabs{width:100%}
  .h-tabs button{flex:1;justify-content:center;padding:9px 8px}
  .h-num{font-size:32px}
  .h-cards{grid-template-columns:minmax(0,1fr);gap:10px}
  .h-card{grid-template-columns:118px minmax(0,1fr);grid-template-rows:auto auto 1fr;border-radius:14px}
  .h-thumb{grid-row:1/4;aspect-ratio:auto;height:100%;min-height:96px;border-bottom:0;border-right:1px solid var(--line-soft)}
  .h-meta{padding:10px 12px 0}
  .h-name{padding:4px 12px 0;font-size:15.5px}
  .h-q{padding:2px 12px 0;margin-bottom:10px;font-size:13px}
}
@media (prefers-reduced-motion: reduce){.h-card,.h-cells a{transition:none}.h-card:hover{transform:none}}
</style>
</head>
<body>
<div class="page">
  <header class="h-top">
    <a class="back" href="../">← 민규쌤의 과학 실험실 (지구과학)</a>
    <div class="h-hero">
      <div>
        <div class="h-kicker">PHYSICS LAB <span class="h-beta">BETA</span></div>
        <h1>물리 실험실</h1>
        <p class="h-lead">물리학 Ⅰ·Ⅱ 개념을 하나씩, 눈으로 보고 손으로 움직이는 실험으로 만들어 가요.</p>
        <div class="h-count" id="count"><b>–<span> / 158</span></b><em>개념 실험</em></div>
        <a class="h-fmap" href="formulas/"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="10" height="7" rx="2"/><rect x="19" y="4" width="10" height="7" rx="2"/><rect x="11" y="21" width="10" height="7" rx="2"/><path d="M8 11c0 5 8 4 8 10M24 11c0 5-8 4-8 10"/></svg><span>공식 지도<small>공식이 어디서 나오는지 이어 보기</small></span></a>
      </div>
      <div class="h-map" id="map" aria-label="개념 지도: 한 칸이 개념 하나, 색칠된 칸은 실험이 있는 개념">
        <p class="h-key">개념 지도를 불러오는 중…</p>
      </div>
    </div>
  </header>

  <div class="h-bar">
    <div class="h-tabs" role="group" aria-label="과목">
      <button type="button" data-course="1" aria-pressed="true">물리학 Ⅰ <small id="n1"></small></button>
      <button type="button" data-course="2" aria-pressed="false">물리학 Ⅱ <small id="n2"></small></button>
    </div>
    <label class="h-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="개념 찾기 (예: 굴절, 광전 효과, 전동기)" autocomplete="off" aria-label="개념 찾기">
    </label>
  </div>

  <main id="list"></main>
</div>
<script>
(function () {
  'use strict';
  // 개념 158개: data/physics_concepts.json, 실험이 있는 개념: data/built.json (physics/tools/build_index.py 가 갱신)
  // 카드 그림: data/thumbs/<ID>.webp · <ID>-dark.webp (physics/tools/thumbs.cjs 가 무대를 찍어 만든다)
  const EXTRA = {'II2-06': ['3D']};          // 카드에 붙이는 작은 표시
  const SUBJ = [{key: '물리학Ⅰ', id: 1, name: '물리학 Ⅰ'}, {key: '물리학Ⅱ', id: 2, name: '물리학 Ⅱ'}];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const short = t => t.split(':')[0].replace(/\s*\(.*?\)\s*$/, '');
  const roman = b => b.split('.')[0].trim();
  const ascii = r => ({'Ⅰ': 'I', 'Ⅱ': 'II', 'Ⅲ': 'III', 'Ⅳ': 'IV'}[r] || r);   // 큰 번호는 세리프 있는 고정폭 글꼴로
  const buTitle = b => b.replace(/^[^.]*\.\s*/, '');
  const norm = s => s.toLowerCase().replace(/[\s·,:()]/g, '');
  const href = c => `${c.unit_code}/${pad(c.no)}/`;

  let D = null, built = new Set(), course = 1;
  try { if (location.hash === '#p2' || (!location.hash && localStorage.getItem('physics.course') === '2')) course = 2; } catch (e) {}

  // 대단원 → 색 번호(1·2·3), 과목별 대단원 순서
  const groupsOf = subjKey => {
    const cs = D.concepts.filter(c => c.subject === subjKey);
    const bigs = [...new Set(cs.map(c => c.big_unit))];
    return bigs.map((b, i) => {
      const inB = cs.filter(c => c.big_unit === b);
      const units = [...new Set(inB.map(c => c.unit_code))].map(u => ({code: u, name: inB.find(c => c.unit_code === u).unit, cs: inB.filter(c => c.unit_code === u)}));
      return {big: b, color: i + 1, cs: inB, units, n: inB.filter(c => built.has(c.id)).length};
    });
  };

  function card(c, color) {
    const tags = (EXTRA[c.id] || []).map(t => `<span class="h-tag">${esc(t)}</span>`).join('');
    return `<li><a class="h-card c${color}" href="${href(c)}" title="${esc(c.concept)}">
      <span class="h-thumb" data-id="${c.id}"><img class="lt" src="data/thumbs/${c.id}.webp" alt="" loading="lazy"><img class="dk" src="data/thumbs/${c.id}-dark.webp" alt="" loading="lazy"></span>
      <span class="h-meta"><span class="h-id">${c.id}</span>${tags}</span>
      <b class="h-name">${esc(short(c.concept))}</b>
      <span class="h-q">${esc(c.question)}</span>
    </a></li>`;
  }
  const soonItem = c => `<li><b>${pad(c.no)}</b><span>${esc(short(c.concept))}</span></li>`;

  function renderMap() {
    let total = 0;
    const rows = SUBJ.map(s => {
      const gs = groupsOf(s.key);
      return `<div class="h-row"><span>${s.name}</span><div class="h-groups">` + gs.map(g => {
        total += g.n;
        const cols = Math.ceil(g.cs.length / 4);
        const cells = g.cs.map(c => built.has(c.id)
          ? `<a href="${href(c)}" title="${esc(c.id + ' ' + short(c.concept))}" aria-label="${esc(c.id + ' ' + short(c.concept))}"></a>`
          : `<i title="${esc(c.id + ' ' + short(c.concept) + ' (준비 중)')}"></i>`).join('');
        return `<div class="h-grp c${g.color}"><div class="h-cells" style="--cols:${cols}" role="img" aria-label="${esc(g.big)}: ${g.cs.length}개 중 ${g.n}개">${cells}</div>
          <small><b>${roman(g.big)}</b> ${esc(buTitle(g.big))} · ${g.n}/${g.cs.length}</small></div>`;
      }).join('') + '</div></div>';
    }).join('');
    $('map').innerHTML = rows + '<p class="h-key"><span><i class="on"></i>실험 있음 (누르면 열림)</span><span><i></i>준비 중</span></p>';
    $('count').innerHTML = `<b>${total}<span> / ${D.concepts.length}</span></b><em>개념이 실험으로 만들어졌어요</em>`;
    for (const s of SUBJ) {
      const cs = D.concepts.filter(c => c.subject === s.key);
      $('n' + s.id).textContent = `${cs.filter(c => built.has(c.id)).length}/${cs.length}`;
    }
  }

  function renderCourse() {
    const s = SUBJ.find(x => x.id === course);
    const gs = groupsOf(s.key);
    let h = '';
    if (!gs.some(g => g.n)) h += `<p class="h-note">${s.name} 실험은 아직 없어요. 개념 ${gs.reduce((a, g) => a + g.cs.length, 0)}개가 차례를 기다리고 있어요.</p>`;
    for (const g of gs) {
      const quiet = !g.n;
      h += `<section class="h-bu c${g.color}${quiet ? ' quiet' : ''}"><header class="h-bu-head"><span class="h-num" aria-hidden="true">${ascii(roman(g.big))}</span><div>
        <h2>${esc(buTitle(g.big))}</h2>
        <div class="h-prog"><i><span style="width:${(100 * g.n / g.cs.length).toFixed(1)}%"></span></i><b>${g.n} / ${g.cs.length}</b></div></div></header>`;
      for (const u of g.units) {
        const have = u.cs.filter(c => built.has(c.id)), rest = u.cs.filter(c => !built.has(c.id));
        h += `<div class="h-unit"><h3>${have.length ? `<a href="${u.code}/">${esc(u.name)}</a>` : esc(u.name)}<small>${u.code} · ${have.length} / ${u.cs.length}</small></h3>`;
        if (have.length) h += '<ul class="h-cards">' + have.map(c => card(c, g.color)).join('') + '</ul>';
        if (rest.length) h += `<details class="h-soon"><summary>${have.length ? '준비 중인 개념 ' + rest.length + '개' : '개념 ' + rest.length + '개 보기'}</summary><ol>${rest.map(soonItem).join('')}</ol></details>`;
        h += '</div>';
      }
      h += '</section>';
    }
    return h;
  }

  function renderSearch(q) {
    const hits = D.concepts.filter(c => norm(`${c.id} ${c.concept} ${c.question} ${c.unit} ${c.big_unit}`).includes(q));
    const colorOf = c => groupsOf(c.subject).findIndex(g => g.big === c.big_unit) + 1;
    const have = hits.filter(c => built.has(c.id)), rest = hits.filter(c => !built.has(c.id));
    if (!hits.length) return '<p class="h-note">찾는 개념이 없어요. 다른 낱말로 찾아보세요.</p>';
    let h = `<section class="h-found"><h2>찾은 개념 ${hits.length}개</h2>`;
    if (have.length) h += '<ul class="h-cards">' + have.map(c => card(c, colorOf(c))).join('') + '</ul>';
    if (rest.length) h += '<ul class="h-plain">' + rest.map(c => `<li class="c${colorOf(c)}"><b>${c.id}</b><span>${esc(short(c.concept))}</span><em>준비 중</em></li>`).join('') + '</ul>';
    return h + '</section>';
  }

  function render() {
    const q = norm($('q').value);
    $('list').innerHTML = q ? renderSearch(q) : renderCourse();
    document.querySelectorAll('[data-course]').forEach(b => b.setAttribute('aria-pressed', String(!q && +b.dataset.course === course)));
    // 그림이 아직 없는 실험은 번호를 크게 보여 준다
    $('list').querySelectorAll('.h-thumb img').forEach(img => img.addEventListener('error', () => img.parentElement.classList.add('none'), {once: true}));
  }

  document.querySelectorAll('[data-course]').forEach(b => b.addEventListener('click', () => {
    course = +b.dataset.course;
    $('q').value = '';
    try { localStorage.setItem('physics.course', String(course)); } catch (e) {}
    try { history.replaceState(null, '', course === 2 ? '#p2' : location.pathname + location.search); } catch (e) {}
    render();
  }));
  $('q').addEventListener('input', render);
  window.addEventListener('hashchange', () => { course = location.hash === '#p2' ? 2 : 1; render(); });

  Promise.all([fetch('data/physics_concepts.json').then(r => r.json()), fetch('data/built.json').then(r => r.json())])
    .then(([d, b]) => { D = d; built = new Set(b.built); renderMap(); render(); })
    .catch(() => { $('list').innerHTML = '<p class="h-note">개념 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; });
})();
</script>
</body>
</html>
