<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>사층리 역전 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        canvas { touch-action: none; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-primary {
            background-color: #3b82f6; color: white; transition: all 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background-color: #2563eb; transform: translateY(-1px); }
        .btn-primary:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .btn-secondary {
            background-color: #f1f5f9; color: #334155; transition: all 0.2s; border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover:not(:disabled) { background-color: #e2e8f0; }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col text-slate-800">

    <!-- Header (Safe Area 적용) -->
    <header class="bg-white border-b border-slate-200 px-4 pt-[max(env(safe-area-inset-top),0.75rem)] pb-3 md:px-6 md:pt-[max(env(safe-area-inset-top),1rem)] md:pb-4 flex justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-lg md:text-2xl font-bold text-slate-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 md:w-7 md:h-7"><path d="m2 12 5.25 5 5.25-11 5.25 11 4.25-4"/></svg>
                사층리 역전 시뮬레이션
            </h1>
            <p class="hidden md:block text-sm text-slate-500 mt-1">지층의 구조를 통해 과거 유체의 흐름 방향과 역전 여부를 분석해보세요.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Canvas Area -->
        <div class="h-[45%] min-h-[250px] md:h-full md:flex-1 relative bg-slate-100 flex items-center justify-center overflow-hidden" id="canvas-container">
            <!-- Background Grid -->
            <div class="absolute inset-0" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; opacity: 0.5;"></div>
            
            <canvas id="simCanvas" class="relative z-10"></canvas>

            <!-- Floating Status -->
            <div id="statusBadge" class="absolute top-3 left-3 md:top-6 md:left-6 z-20 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-bold shadow-md transition-colors duration-300 bg-emerald-100 text-emerald-700 border border-emerald-200">
                정상 상태 (Normal)
            </div>
        </div>

        <!-- Control Panel (Sidebar) -->
        <aside class="h-[55%] md:h-full w-full md:w-[400px] glass-panel flex flex-col z-20 border-t md:border-t-0 md:border-l border-slate-200 overflow-y-auto shrink-0">
            <div class="p-4 md:p-6 pb-[max(env(safe-area-inset-bottom),1rem)] md:pb-[max(env(safe-area-inset-bottom),1.5rem)] space-y-6 md:space-y-8">
                
                <!-- 1. Flow Direction Control -->
                <section>
                    <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span>
                        과거 유체 흐름 방향
                    </h2>
                    <div class="flex gap-2">
                        <button id="btnFlowLeftRight" class="flex-1 btn-secondary py-2 md:py-3 rounded-lg font-medium border-2 border-blue-500 bg-blue-50 text-blue-700" onclick="setFlowDirection(1)">
                            왼쪽 → 오른쪽
                        </button>
                        <button id="btnFlowRightLeft" class="flex-1 btn-secondary py-2 md:py-3 rounded-lg font-medium" onclick="setFlowDirection(-1)">
                            오른쪽 → 왼쪽
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">* 층리가 형성될 당시의 물이나 바람의 방향입니다.</p>
                </section>

                <!-- 2. Tectonic Event Control -->
                <section>
                    <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <span class="bg-amber-100 text-amber-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">2</span>
                        지각 변동 (지층 역전)
                    </h2>
                    <button id="btnInvert" class="w-full btn-primary py-3 md:py-4 rounded-lg font-bold text-base md:text-lg flex items-center justify-center gap-2" onclick="toggleInversion()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                        지층 뒤집기 (180° 회전)
                    </button>
                </section>

                <!-- 3. Hint/Analysis -->
                <section>
                    <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <span class="bg-purple-100 text-purple-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">3</span>
                        구조 분석 (힌트)
                    </h2>
                    <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" id="chkHint" class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500" onchange="toggleHint()">
                        <span class="font-medium">구조적 특징 및 과거 흐름 방향 보기</span>
                    </label>
                </section>

                <!-- Explanation Box -->
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm leading-relaxed" id="explanationBox">
                    <h3 class="font-bold text-slate-700 mb-2">학습 포인트</h3>
                    <ul class="list-disc pl-4 space-y-2 text-slate-600" id="explanationList">
                        <li><b>정상 사층리:</b> 윗면은 층리가 비스듬히 잘린 모양(급경사)이고, 아랫면은 기저면과 나란하게 수렴하는 모양(완만한 경사)입니다.</li>
                        <li><b>유체의 흐름:</b> 사층리의 기울기가 완만해지는 방향(수렴하는 방향)이 곧 과거에 유체가 흘렀던 방향입니다.</li>
                    </ul>
                </div>

            </div>
        </aside>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // State Variables
        const state = {
            flowDirection: 1, // 1: L to R, -1: R to L
            angle: 0,         // Current rotation angle (degrees)
            targetAngle: 0,   // Target rotation angle (degrees)
            isInverted: false,
            isAnimating: false,
            showHint: false,
            time: 0           // For fluid animation
        };

        // Layout Constants
        const BLOCK_WIDTH = 500;
        const BLOCK_HEIGHT = 200;
        const BEDDING_SPACING = 30;

        // Resize Canvas (고해상도 디스플레이 대응)
        let viewW = 0, viewH = 0;
        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            viewW = container.clientWidth;
            viewH = container.clientHeight;
            canvas.style.width = viewW + 'px';
            canvas.style.height = viewH + 'px';
            canvas.width = Math.round(viewW * dpr);
            canvas.height = Math.round(viewH * dpr);
            // 이후 그리기는 모두 CSS 픽셀 좌표계로 수행된다
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // Control Functions
        function setFlowDirection(dir) {
            if (state.isAnimating || state.isInverted) return;
            state.flowDirection = dir;
            
            // Update UI
            const btnLR = document.getElementById('btnFlowLeftRight');
            const btnRL = document.getElementById('btnFlowRightLeft');
            
            if (dir === 1) {
                btnLR.className = "flex-1 btn-secondary py-2 md:py-3 rounded-lg font-medium border-2 border-blue-500 bg-blue-50 text-blue-700";
                btnRL.className = "flex-1 btn-secondary py-2 md:py-3 rounded-lg font-medium border-2 border-transparent";
            } else {
                btnRL.className = "flex-1 btn-secondary py-2 md:py-3 rounded-lg font-medium border-2 border-blue-500 bg-blue-50 text-blue-700";
                btnLR.className = "flex-1 btn-secondary py-2 md:py-3 rounded-lg font-medium border-2 border-transparent";
            }
            updateExplanation();
        }

        function toggleInversion() {
            if (state.isAnimating) return;
            
            state.isInverted = !state.isInverted;
            state.targetAngle = state.isInverted ? 180 : 0;
            state.isAnimating = true;

            // Disable flow buttons while inverted
            document.getElementById('btnFlowLeftRight').disabled = state.isInverted;
            document.getElementById('btnFlowRightLeft').disabled = state.isInverted;

            // Update UI Button text
            const btn = document.getElementById('btnInvert');
            if (state.isInverted) {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> 정상 상태로 복구하기`;
                btn.className = "w-full btn-secondary py-3 md:py-4 rounded-lg font-bold text-base md:text-lg flex items-center justify-center gap-2 border-2 border-amber-500 text-amber-700 bg-amber-50";
            } else {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg> 지층 뒤집기 (180° 회전)`;
                btn.className = "w-full btn-primary py-3 md:py-4 rounded-lg font-bold text-base md:text-lg flex items-center justify-center gap-2";
            }

            // Update Status Badge
            const badge = document.getElementById('statusBadge');
            if (state.isInverted) {
                badge.textContent = "역전 상태 (Inverted)";
                badge.className = "absolute top-3 left-3 md:top-6 md:left-6 z-20 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-bold shadow-md transition-colors duration-300 bg-rose-100 text-rose-700 border border-rose-200";
            } else {
                badge.textContent = "정상 상태 (Normal)";
                badge.className = "absolute top-3 left-3 md:top-6 md:left-6 z-20 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-bold shadow-md transition-colors duration-300 bg-emerald-100 text-emerald-700 border border-emerald-200";
            }

            updateExplanation();
        }

        function toggleHint() {
            state.showHint = document.getElementById('chkHint').checked;
        }

        function updateExplanation() {
            const list = document.getElementById('explanationList');
            let html = '';
            
            if (!state.isInverted) {
                html += `<li><b>정상 사층리:</b> 윗면은 층리가 비스듬히 잘린 모양(급경사)이고, 아랫면은 기저면과 나란하게 수렴하는 모양(완만한 경사)입니다.</li>`;
                if (state.flowDirection === 1) {
                    html += `<li><b>현재 유체 방향:</b> 지층이 오른쪽으로 기울며 수렴하므로, 과거 유체는 <b>왼쪽에서 오른쪽</b>으로 흘렀습니다.</li>`;
                } else {
                    html += `<li><b>현재 유체 방향:</b> 지층이 왼쪽으로 기울며 수렴하므로, 과거 유체는 <b>오른쪽에서 왼쪽</b>으로 흘렀습니다.</li>`;
                }
            } else {
                html += `<li><b class="text-rose-600">역전된 사층리:</b> 윗면과 아랫면이 뒤집혔습니다! <b>잘린 모양이 아래쪽</b>에, <b>수렴하는 모양이 위쪽</b>에 나타납니다.</li>`;
                html += `<li><b>핵심:</b> 현재 보이는 모양에 현혹되지 마세요. <span class="bg-amber-100 px-1 rounded">수렴하는 방향(나란해지는 쪽)</span>이 과거의 하류 방향입니다.</li>`;
                if (state.flowDirection === 1) {
                    html += `<li>과거 유체는 여전히 <b>왼쪽에서 오른쪽</b>으로 흘렀습니다.</li>`;
                } else {
                    html += `<li>과거 유체는 여전히 <b>오른쪽에서 왼쪽</b>으로 흘렀습니다.</li>`;
                }
            }
            list.innerHTML = html;
        }

        // Drawing Functions
        function drawArrow(ctx, fromx, fromy, tox, toy, width, color) {
            const headlen = 15;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(tox, toy);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawFluidAnimation() {
            // Draw flowing lines above the block
            if (state.isInverted || state.isAnimating) return; // Don't show active fluid if inverted

            ctx.save();
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)'; // Blue-ish
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            const startX = -BLOCK_WIDTH/2;
            const endX = BLOCK_WIDTH/2;
            const yLevel = -BLOCK_HEIGHT/2 - 30;

            // Flow speed
            const speed = state.flowDirection * 2;
            const offset = (state.time * speed) % 100;

            ctx.beginPath();
            for(let i = -100; i < BLOCK_WIDTH + 100; i += 50) {
                let x = startX + i + offset;
                if(x < startX - 50) x += BLOCK_WIDTH + 150;
                if(x > endX + 50) x -= BLOCK_WIDTH + 150;
                
                // Draw small wave/arrow line
                ctx.moveTo(x, yLevel);
                ctx.lineTo(x + 30 * state.flowDirection, yLevel);
                
                // Arrow head
                ctx.moveTo(x + 30 * state.flowDirection, yLevel);
                ctx.lineTo(x + 20 * state.flowDirection, yLevel - 5);
                ctx.moveTo(x + 30 * state.flowDirection, yLevel);
                ctx.lineTo(x + 20 * state.flowDirection, yLevel + 5);
            }
            ctx.stroke();
            
            // Text
            ctx.fillStyle = '#2563eb';
            ctx.font = 'bold 16px Pretendard';
            ctx.textAlign = 'center';
            ctx.fillText('현재 유체 (물/바람) 흐름', 0, yLevel - 20);
            ctx.restore();
        }

        function drawCrossBeddingBlock() {
            ctx.save();
            
            // Convert angle to radians
            ctx.rotate(state.angle * Math.PI / 180);

            const bx = -BLOCK_WIDTH / 2;
            const by = -BLOCK_HEIGHT / 2;

            // 1. Draw Base Rock (Sandstone)
            ctx.fillStyle = '#eaddcf'; // Sand color
            ctx.fillRect(bx, by, BLOCK_WIDTH, BLOCK_HEIGHT);

            // 2. Add some texture
            ctx.fillStyle = 'rgba(0,0,0,0.03)';
            for(let i=0; i<100; i++) {
                ctx.beginPath();
                ctx.arc(bx + Math.random()*BLOCK_WIDTH, by + Math.random()*BLOCK_HEIGHT, Math.random()*2, 0, Math.PI*2);
                ctx.fill();
            }

            // 3. Draw Bedding Lines
            // We draw curves. Top is truncated, bottom is tangential.
            ctx.strokeStyle = '#bfa58a';
            ctx.lineWidth = 2;
            
            // Clip to block boundaries
            ctx.beginPath();
            ctx.rect(bx, by, BLOCK_WIDTH, BLOCK_HEIGHT);
            ctx.clip();

            const d = state.flowDirection * (BLOCK_WIDTH * 0.4); // Horizontal spread of curve
            const startLimit = -BLOCK_WIDTH;
            const endLimit = BLOCK_WIDTH * 1.5;

            for (let x = startLimit; x < endLimit; x += BEDDING_SPACING) {
                ctx.beginPath();
                // Start at top (x, by)
                ctx.moveTo(x, by);
                // Control point at bottom to make it tangential (x, by+BLOCK_HEIGHT)
                // End point shifted by d (x+d, by+BLOCK_HEIGHT)
                ctx.quadraticCurveTo(x, by + BLOCK_HEIGHT, x + d, by + BLOCK_HEIGHT);
                ctx.stroke();
            }

            // Draw thick border for the block
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 4;
            ctx.strokeRect(bx, by, BLOCK_WIDTH, BLOCK_HEIGHT);

            ctx.restore();
        }

        function drawHints() {
            if (!state.showHint) return;

            ctx.save();
            const bx = -BLOCK_WIDTH / 2;
            const by = -BLOCK_HEIGHT / 2;

            // Highlight Truncated (잘린 면) vs Tangential (수렴하는 면)
            const isFlipped = state.angle > 90;
            
            // Y positions based on rotation
            const topY = by;
            const bottomY = by + BLOCK_HEIGHT;

            ctx.font = 'bold 16px Pretendard';
            ctx.textAlign = 'center';

            if (!isFlipped) {
                // NORMAL STATE
                // Top Highlight (Truncated)
                ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; // Red-ish highlight
                ctx.fillRect(bx, topY, BLOCK_WIDTH, 20);
                ctx.fillStyle = '#ef4444';
                ctx.fillText('윗면: 지층이 깎인 모양 (급경사, 간격 좁음)', 0, topY - 15);

                // Bottom Highlight (Tangential)
                ctx.fillStyle = 'rgba(16, 185, 129, 0.2)'; // Green-ish highlight
                ctx.fillRect(bx, bottomY - 20, BLOCK_WIDTH, 20);
                ctx.fillStyle = '#10b981';
                ctx.fillText('아랫면: 기저면과 수렴하는 모양 (완만함, 간격 넓음)', 0, bottomY + 25);
            } else {
                // INVERTED STATE
                // Top Highlight (Actually the original bottom - Tangential)
                ctx.fillStyle = 'rgba(16, 185, 129, 0.2)'; 
                ctx.fillRect(bx, topY, BLOCK_WIDTH, 20);
                ctx.fillStyle = '#10b981';
                ctx.fillText('현재 윗면 (원래 아랫면): 수렴하는 모양이 위로 옴!', 0, topY - 15);

                // Bottom Highlight (Actually the original top - Truncated)
                ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; 
                ctx.fillRect(bx, bottomY - 20, BLOCK_WIDTH, 20);
                ctx.fillStyle = '#ef4444';
                ctx.fillText('현재 아랫면 (원래 윗면): 깎인 모양이 아래로 옴!', 0, bottomY + 25);
            }

            // Draw Big Arrow for Past Flow Direction
            const arrowY = 0; // Center Y
            const arrowStartX = -state.flowDirection * 150;
            const arrowEndX = state.flowDirection * 150;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(-120, arrowY - 40, 240, 80);
            ctx.strokeStyle = '#94a3b8';
            ctx.strokeRect(-120, arrowY - 40, 240, 80);

            drawArrow(ctx, arrowStartX, arrowY, arrowEndX, arrowY, 6, '#8b5cf6'); // Purple arrow
            
            ctx.fillStyle = '#7c3aed';
            ctx.font = 'bold 18px Pretendard';
            ctx.fillText('과거 유체 흐름 방향', 0, arrowY - 15);
            
            ctx.restore();
        }

        // Main Animation Loop
        // 주사율(60Hz/120Hz)과 무관하게 같은 속도로 재생하기 위한 델타 타임
        let lastFrame = performance.now();
        function animate(now) {
            if (now === undefined) now = performance.now();
            // 60fps 한 프레임을 1.0으로 보는 배율. 탭 복귀 시 튀지 않도록 상한을 둔다
            const dt = Math.min((now - lastFrame) / (1000 / 60), 4);
            lastFrame = now;

            // Logic Update
            state.time += dt;

            if (state.isAnimating) {
                const diff = state.targetAngle - state.angle;
                if (Math.abs(diff) < 0.5) {
                    state.angle = state.targetAngle;
                    state.isAnimating = false;
                } else {
                    state.angle += diff * (1 - Math.pow(1 - 0.05, dt)); // Ease out
                }
            }

            // Clear Canvas
            ctx.clearRect(0, 0, viewW, viewH);

            const cx = viewW / 2;
            const cy = viewH / 2;

            // 화면 크기에 맞게 캔버스 스케일링 (위아래 여백을 더 확보)
            const scale = Math.min(1, viewW / (BLOCK_WIDTH + 60), viewH / (BLOCK_HEIGHT + 220));

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);

            // Render
            drawFluidAnimation();
            drawCrossBeddingBlock();
            drawHints();

            ctx.restore();

            requestAnimationFrame(animate);
        }

        // Initialize
        updateExplanation();
