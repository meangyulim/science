<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>대폭발 우주론의 한계와 급팽창 이론</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; user-select: none; }
        canvas { touch-action: none; outline: none; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Top Tabs */
        .mode-tab {
            transition: all 0.3s ease; border-bottom: 3px solid transparent; opacity: 0.6;
        }
        .mode-tab.active {
            border-bottom-color: #38bdf8; opacity: 1; color: #38bdf8;
        }
        .mode-tab:hover:not(.active) { opacity: 0.8; }

        /* Theory Toggle */
        .theory-toggle { transition: all 0.3s; }
        .theory-toggle.active-standard { background-color: #ef4444; color: white; border-color: #f87171; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .theory-toggle.active-inflation { background-color: #10b981; color: white; border-color: #34d399; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

        /* Curvature Buttons */
        .curv-btn { transition: all 0.2s; border: 1px solid #475569; background: rgba(30,41,59,0.8); color: #94a3b8; }
        .curv-btn.active { border-color: #38bdf8; background: rgba(56,189,248,0.2); color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.3); }

        /* Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; }
        input[type=range]:focus { outline: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-[#0b1120] border-b border-slate-800 shrink-0 z-20">
        <div class="px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-white flex items-center gap-2">
                    <span class="text-sky-400">🌌 우주론의 한계 극복:</span> 급팽창 이론 (Inflation)
                </h1>
            </div>
            <!-- Theme Tabs -->
            <div class="flex gap-6 font-bold text-sm md:text-base">
                <button class="mode-tab active pb-2" onclick="setMode('flatness')" id="tab-flatness">1. 우주 평탄성 문제</button>
                <button class="mode-tab pb-2" onclick="setMode('horizon')" id="tab-horizon">2. 지평선 문제</button>
                <button class="mode-tab pb-2" onclick="setMode('monopole')" id="tab-monopole">3. 자기 홀극 문제</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative bg-[#020617]">
        
        <!-- Canvas Section (Left) -->
        <div class="h-[50%] md:h-full md:flex-1 relative flex flex-col items-center justify-center overflow-hidden shrink-0 cursor-move" id="canvas-container">
            <canvas id="bgCanvas" class="absolute inset-0 z-0 opacity-40"></canvas>
            <canvas id="simCanvas" class="absolute inset-0 z-10 w-full h-full"></canvas>

            <!-- 3D Rotation Hint (Only for flatness) -->
            <div id="drag-hint" class="absolute top-6 left-6 z-20 bg-slate-800/80 border border-slate-600 px-4 py-2 rounded-full flex items-center gap-2 text-sky-400 font-bold text-sm shadow-lg animate-pulse pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l-3-3 3-3"/><path d="M19 9l3 3-3 3"/><path d="M2 12h20"/></svg>
                화면을 드래그하여 3D 시점을 회전해보세요
            </div>

            <!-- Theory Toggle Buttons (Overlay) -->
            <div class="absolute top-6 right-6 z-20 flex bg-slate-900/80 p-1 rounded-lg border border-slate-700 shadow-2xl backdrop-blur-sm">
                <button class="theory-toggle active-standard px-4 py-2 text-sm font-bold rounded-md" id="btn-theory-std" onclick="setTheory('standard')">
                    ⚠️ 대폭발 우주론
                </button>
                <button class="theory-toggle text-slate-400 px-4 py-2 text-sm font-bold rounded-md" id="btn-theory-inf" onclick="setTheory('inflation')">
                    ✅ 급팽창 이론
                </button>
            </div>

            <!-- Curvature Controls (Only for Flatness) -->
            <div id="curvature-controls" class="absolute bottom-6 left-6 z-20 bg-slate-900/80 border border-slate-700 p-3 rounded-xl shadow-xl backdrop-blur-sm">
                <p class="text-xs font-bold text-slate-400 mb-2 text-center">우주 초기 공간의 곡률</p>
                <div class="flex gap-2">
                    <button class="curv-btn px-3 py-1.5 rounded font-bold text-xs" id="curv-positive" onclick="setCurvature(0.006)">곡률 &gt; 0 (닫힌 우주)</button>
                    <button class="curv-btn active px-3 py-1.5 rounded font-bold text-xs" id="curv-zero" onclick="setCurvature(0)">곡률 = 0 (평탄 우주)</button>
                    <button class="curv-btn px-3 py-1.5 rounded font-bold text-xs" id="curv-negative" onclick="setCurvature(-0.006)">곡률 &lt; 0 (열린 우주)</button>
                </div>
            </div>
        </div>

        <!-- Sidebar Control & Info Panel (Right) -->
        <aside class="h-[50%] md:h-full w-full md:w-[400px] lg:w-[450px] border-t md:border-t-0 md:border-l border-slate-700 bg-[#0f172a] flex flex-col relative z-30 shrink-0 shadow-2xl">
            
            <!-- Explanation Text -->
            <div class="flex-1 overflow-y-auto p-6 text-slate-300 space-y-4 text-[15px] leading-relaxed" id="info-panel">
                <!-- Javascript injects content -->
            </div>

            <!-- Timeline Controller -->
            <div class="p-6 bg-slate-800 border-t border-slate-700 pb-[max(env(safe-area-inset-bottom),1.5rem)]">
                <div class="flex items-center gap-4">
                    <button id="btnPlay" class="w-14 h-14 shrink-0 bg-sky-500 hover:bg-sky-400 text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95" onclick="togglePlay()">
                        <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <div class="flex-1">
                        <div class="flex justify-between items-end mb-2">
                            <span class="font-bold text-sky-400" id="time-status-label">시간 흐름</span>
                            <span class="text-xs font-mono bg-slate-900 px-2 py-1 rounded border border-slate-700">Time: <span id="time-val">0</span></span>
                        </div>
                        <input type="range" id="timeSlider" min="0" max="100" value="0" step="0.5" oninput="manualSeek()">
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <script>
        // --- 1. Canvas Setup ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        let cw, ch;

        // --- 2. 3D Engine State (For Flatness Mode) ---
        let rotX = Math.PI / 6;   // Camera elevation angle
        let rotY = -Math.PI / 4;  // Camera azimuth angle
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // Pointer Events for 3D Rotation
        container.addEventListener('pointerdown', (e) => {
            if (currentMode !== 'flatness') return;
            // 버튼 조작 시 회전 방지
            if(e.target.closest('button') || e.target.closest('input')) return;
            
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            document.getElementById('drag-hint').style.opacity = '0'; // Hide hint once interacted
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastMouseX;
            const deltaY = e.clientY - lastMouseY;
            
            rotY += deltaX * 0.01;
            rotX += deltaY * 0.01;
            
            // Limit elevation
            rotX = Math.max(0, Math.min(Math.PI / 2, rotX));

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            if(!isPlaying) draw();
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointercancel', () => { isDragging = false; });

        // --- 3. Simulation States ---
        let currentMode = 'flatness'; // flatness, horizon, monopole
        let currentTheory = 'standard'; // standard, inflation
        let time = 0; // 0 to 100
        let isPlaying = false;
        let initialCurvature = 0; // 0=flat, >0=closed, <0=open

        const monopoles = []; // Particles array

        function resizeCanvas() {
            cw = container.clientWidth;
            ch = container.clientHeight;
            canvas.width = cw;
            canvas.height = ch;
            drawBackgroundStars();
            if (monopoles.length === 0) initMonopoles();
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawBackgroundStars() {
            bgCanvas.width = cw; bgCanvas.height = ch;
            bgCtx.clearRect(0,0,cw,ch);
            bgCtx.fillStyle = '#ffffff';
            for(let i=0; i<200; i++) {
                bgCtx.globalAlpha = Math.random() * 0.5 + 0.1;
                bgCtx.beginPath();
                bgCtx.arc(Math.random()*cw, Math.random()*ch, Math.random()*2, 0, Math.PI*2);
                bgCtx.fill();
            }
            bgCtx.globalAlpha = 1.0;
        }

        // --- 4. Content Dictionary (수식 오류 수정) ---
        const content = {
            flatness: {
                standard: `
                    <h3 class="text-xl font-black text-red-400 mb-4 pb-2 border-b border-red-500/30">우주 평탄성의 문제</h3>
                    <p>현재 관측 결과, 우주는 곡률이 0인 <b>평탄한 우주</b>입니다.</p>
                    <p class="mt-3">하지만 기존 대폭발 우주론에 따르면, 우주 초기에 곡률이 아주 조금이라도 0이 아니었다면 팽창할수록 곡률이 극단적으로 커졌을 것입니다. <b>현재처럼 평탄하려면 초기 우주 밀도가 10<sup>-60</sup> 수준의 오차도 없이 완벽하게 임계 밀도와 같았어야 한다는 확률적 모순</b>이 발생합니다.</p>
                    <div class="mt-5 p-4 bg-red-950/40 rounded-xl border border-red-500/30">
                        <span class="text-red-400 font-bold text-sm tracking-wide">⚠️ 3D 관찰 포인트:</span><br>
                        좌측 하단의 곡률 버튼을 누른 후 화면을 돌려보세요. 팽창(재생) 후에도 우주 공간의 휨이 그대로 유지되어 빛(레이저)이 직진하지 못하고 휩니다.
                    </div>
                `,
                inflation: `
                    <h3 class="text-xl font-black text-emerald-400 mb-4 pb-2 border-b border-emerald-500/30">급팽창을 통한 평탄성 해결</h3>
                    <p>급팽창 이론에 따르면 우주는 탄생 직후 빛보다 빠른 속도로 <b>지수함수적 급팽창</b>을 겪었습니다.</p>
                    <p class="mt-3">우주 공간 자체가 무한히 뻗어나가며 커지면서, <b>초기 공간이 어떻게 휘어져 있었든 상관없이 표면의 곡률 반경이 무한대에 가까워져 국부적으로는 완벽하게 평탄(k=0)해집니다.</b></p>
                    <div class="mt-5 p-4 bg-emerald-950/40 rounded-xl border border-emerald-500/30">
                        <span class="text-emerald-400 font-bold text-sm tracking-wide">✅ 3D 해결 포인트:</span><br>
                        어떤 곡률을 선택하든, 재생 버튼을 눌러 <b>급팽창</b>이 일어나는 순간 휘어졌던 3D 공간 격자가 폭발적으로 펴지며 곡률이 0이 되고 빛이 완벽하게 직진합니다!
                    </div>
                `
            },
            horizon: {
                standard: `
                    <h3 class="text-xl font-black text-red-400 mb-4 pb-2 border-b border-red-500/30">지평선 문제</h3>
                    <p>우주 배경 복사를 관측하면, 우주 반대편 끝에 있는 가장 먼 은하들의 온도가 완벽히 같습니다.</p>
                    <p class="mt-3">우주가 한 점에서 탄생했더라도 <b>팽창 속도가 빛보다 빨랐다면, 두 지역이 한 번도 빛이나 물질을 교환하여 서로의 온도를 맞출(열평형) 시간이 없었습니다.</b> 정보 교환 없이 어떻게 온도가 똑같을 수 있을까요?</p>
                    <div class="mt-5 p-4 bg-red-950/40 rounded-xl border border-red-500/30">
                        <span class="text-red-400 font-bold text-sm tracking-wide">⚠️ 관찰 포인트:</span><br>
                        시뮬레이션 초기, 한 점에서 팽창을 시작함에도 붉은색과 푸른색 정보 전달 반경(빛의 원뿔)이 닿기도 전에 은하가 더 빨리 멀어집니다. 물리적으로 온도 교환이 불가능합니다.
                    </div>
                `,
                inflation: `
                    <h3 class="text-xl font-black text-emerald-400 mb-4 pb-2 border-b border-emerald-500/30">급팽창을 통한 지평선 해결</h3>
                    <p>급팽창 이론은 해결책을 제시합니다. 급팽창 이전 초기의 아주 작은 우주에서는 은하들이 멀어지는 속도가 빛보다 느려 <b>서로 빛이 닿을 수 있는 매우 가까운 거리</b>에 모여 있었습니다.</p>
                    <p class="mt-3">이때 <b>미리 에너지를 교환하여 완벽히 똑같은 온도를 맞춘 후, 급팽창을 통해 순식간에 우주 양 끝으로 멀어진 것</b>입니다.</p>
                    <div class="mt-5 p-4 bg-emerald-950/40 rounded-xl border border-emerald-500/30">
                        <span class="text-emerald-400 font-bold text-sm tracking-wide">✅ 해결 포인트:</span><br>
                        초기 팽창 전, 빛이 혼합(노란색 구역)되어 열평형에 도달하고 직후 <b>급팽창</b>에 의해 빛의 이동 속도보다 훨씬 빠르게 지평선 밖으로 밀려납니다.
                    </div>
                `
            },
            monopole: {
                standard: `
                    <h3 class="text-xl font-black text-red-400 mb-4 pb-2 border-b border-red-500/30">자기 홀극 문제</h3>
                    <p>대통일 이론에 따르면 우주 초기 초고온 상태에서 <b>N극 또는 S극만 가진 '자기 홀극' 입자</b>가 대량 생성되었습니다.</p>
                    <p class="mt-3">기존 대폭발 우주론의 일관된 팽창 속도라면 <b>현재 관측 가능한 우주 내에서도 충분히 많은 수의 자기 홀극이 발견되어야 합니다.</b> 하지만 실제로는 전혀 관측되지 않습니다.</p>
                    <div class="mt-5 p-4 bg-red-950/40 rounded-xl border border-red-500/30">
                        <span class="text-red-400 font-bold text-sm tracking-wide">⚠️ 관찰 포인트:</span><br>
                        우주 팽창에도 불구하고 관측 카메라 앵글 안(관측 가능한 우주)에 수많은 N/S 입자가 바글거리며 남아있습니다.
                    </div>
                `,
                inflation: `
                    <h3 class="text-xl font-black text-emerald-400 mb-4 pb-2 border-b border-emerald-500/30">급팽창을 통한 자기 홀극 해결</h3>
                    <p>초기에 자기 홀극이 생성된 것은 맞으나, 그 직후 우주가 <b>부피 기준으로 10<sup>78</sup>배 이상 급격하게 팽창</b>해버렸습니다.</p>
                    <p class="mt-3">우주 공간이 상상 이상으로 넓어지면서 <b>단위 부피당 자기 홀극의 밀도가 0에 수렴할 정도로 희박하게 흩어졌기 때문</b>에 우리가 관측 가능한 우주 내에서는 찾을 수 없는 것입니다.</p>
                    <div class="mt-5 p-4 bg-emerald-950/40 rounded-xl border border-emerald-500/30">
                        <span class="text-emerald-400 font-bold text-sm tracking-wide">✅ 해결 포인트:</span><br>
                        급팽창이 발생하는 순간 수많은 입자들이 관측 가능한 영역 밖으로 폭발적으로 멀어지며 밀도가 0이 되는 모습을 확인하세요.
                    </div>
                `
            }
        };

        // --- 5. UI Handlers ---
        function setMode(mode) {
            currentMode = mode;
            ['flatness', 'horizon', 'monopole'].forEach(m => {
                const tab1 = document.getElementById(`tab-${m}`);
                if (tab1) tab1.className = m === mode ? "mode-tab active pb-2" : "mode-tab pb-2";
            });

            const dragHint = document.getElementById('drag-hint');
            if (dragHint) {
                dragHint.style.display = mode === 'flatness' ? 'flex' : 'none';
                if(mode === 'flatness') dragHint.style.opacity = '1';
            }
            
            const curvControls = document.getElementById('curvature-controls');
            if (curvControls) {
                curvControls.style.display = mode === 'flatness' ? 'block' : 'none';
            }

            resetSim();
        }

        function setTheory(theory) {
            currentTheory = theory;
            const btnStd = document.getElementById('btn-theory-std');
            const btnInf = document.getElementById('btn-theory-inf');
            
            if(theory === 'standard') {
                btnStd.className = "theory-toggle active-standard px-4 py-2 text-sm font-bold rounded-md";
                btnInf.className = "theory-toggle text-slate-400 px-4 py-2 text-sm font-bold rounded-md border border-transparent";
            } else {
                btnStd.className = "theory-toggle text-slate-400 px-4 py-2 text-sm font-bold rounded-md border border-transparent";
                btnInf.className = "theory-toggle active-inflation px-4 py-2 text-sm font-bold rounded-md";
            }
            resetSim();
        }

        function setCurvature(val) {
            initialCurvature = val;
            ['positive', 'zero', 'negative'].forEach(id => {
                const btn = document.getElementById(`curv-${id}`);
                if (btn) btn.className = "curv-btn px-3 py-1.5 rounded font-bold text-xs";
            });
            
            if(val > 0) document.getElementById('curv-positive').className = "curv-btn active px-3 py-1.5 rounded font-bold text-xs";
            else if(val === 0) document.getElementById('curv-zero').className = "curv-btn active px-3 py-1.5 rounded font-bold text-xs";
            else document.getElementById('curv-negative').className = "curv-btn active px-3 py-1.5 rounded font-bold text-xs";
            
            resetSim();
        }

        function resetSim() {
            time = 0;
            document.getElementById('timeSlider').value = 0;
            if(currentMode === 'monopole') initMonopoles();
            
            const infoPanel = document.getElementById('info-panel');
            if (infoPanel) {
                infoPanel.innerHTML = content[currentMode][currentTheory];
            }
            draw();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('iconPlay').classList.toggle('hidden', isPlaying);
            document.getElementById('iconPause').classList.toggle('hidden', !isPlaying);
        }

        function manualSeek() {
            time = parseFloat(document.getElementById('timeSlider').value);
            draw();
        }

        // --- 6. Math & Physics Engine ---
        function getScaleFactor(t, theory) {
            let a = 1.0 + (t / 100) * 1.5; 
            
            if (theory === 'inflation') {
                if (t > 20) {
                    let phase = Math.min((t - 20) / 15, 1.0); 
                    a += Math.pow(phase, 3) * 40.0; // Exponential blow up
                }
                if (t > 35) {
                    a += ((t - 35) / 65) * 2.0; 
                }
            }
            return a;
        }

        // 3D Engine for Flatness
        function rotate3D(x, y, z, rX, rY) {
            const cosY = Math.cos(rY), sinY = Math.sin(rY);
            const x1 = x * cosY + z * sinY;
            const z1 = -x * sinY + z * cosY;
            const cosX = Math.cos(rX), sinX = Math.sin(rX);
            const y2 = y * cosX - z1 * sinX;
            const z2 = y * sinX + z1 * cosX;
            return { x: x1, y: y2, z: z2 };
        }

        function project3D(x, y, z, cx, cy) {
            const p = rotate3D(x, y, z, rotX, rotY);
            const fov = 800;
            const scale = fov / (fov + p.z + 400); 
            return { x: cx + p.x * scale, y: cy + p.y * scale, scale: scale };
        }

        // --- 7. Render Routines ---
        
        function drawFlatness() {
            const cx = cw / 2 - (cw > 1024 ? 150 : 0); 
            const cy = ch / 2 + 50;
            
            let scale = getScaleFactor(time, currentTheory);
            
            // 핵심: 평탄성 직진성 확보
            // 인플레이션 이후(time > 35)에는 곡률(currentCurv)을 강제로 0으로 만들어 직진을 완벽하게 보장합니다.
            let currentCurv = initialCurvature; 
            if (currentTheory === 'inflation') {
                if (time > 20 && time <= 35) {
                    let flattenFactor = (time - 20) / 15;
                    currentCurv = initialCurvature * Math.pow(1 - flattenFactor, 3); 
                } else if (time > 35) {
                    currentCurv = 0; // 완벽한 평탄!
                }
            }

            // 3D Grid
            ctx.strokeStyle = `rgba(56, 189, 248, ${Math.max(0.15, 0.7 - scale*0.015)})`;
            ctx.lineWidth = 1.5;
            
            const gridCount = 14;
            const step = 30 * scale;
            const offset = (gridCount * step) / 2;

            for(let i = 0; i <= gridCount; i++) {
                ctx.beginPath();
                for(let j = 0; j <= gridCount; j++) {
                    let lx = i * step - offset; let ly = j * step - offset;
                    let lz = currentCurv * (lx*lx + ly*ly) * (1/scale); 
                    let p = project3D(lx, ly, lz, cx, cy);
                    if(j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
                
                ctx.beginPath();
                for(let j = 0; j <= gridCount; j++) {
                    let lx = j * step - offset; let ly = i * step - offset;
                    let lz = currentCurv * (lx*lx + ly*ly) * (1/scale);
                    let p = project3D(lx, ly, lz, cx, cy);
                    if(j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            // Lasers (Light Paths) - 직진성 완벽 보장
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            const rayOffset = 80 * scale; 
            
            const drawRay = (yPos, color) => {
                ctx.strokeStyle = color; ctx.shadowColor = color;
                ctx.beginPath();
                for(let lx = -offset; lx <= offset; lx += 15) {
                    let bend = 0;
                    if(Math.abs(currentCurv) > 0.000001) { // 0이 아닐 때만 휨 적용
                        bend = (lx * lx) * currentCurv * 0.4 * Math.sign(yPos);
                    }
                    let ly = yPos - bend;
                    let lz = currentCurv * (lx*lx + ly*ly) * (1/scale);
                    let p = project3D(lx, ly, lz, cx, cy);
                    if (lx === -offset) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            };

            // Draw Red Lasers
            drawRay(-rayOffset, '#ef4444'); 
            drawRay(rayOffset, '#ef4444');  
            ctx.shadowBlur = 0;

            // Center Label
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.beginPath(); ctx.roundRect(cx - 120, 80, 240, 70, 8); ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 18px Pretendard';
            ctx.fillText(`현재 곡률 (k)`, cx, 110);
            
            ctx.font = 'bold 14px Pretendard';
            if (Math.abs(currentCurv) < 0.00001) {
                ctx.fillStyle = '#34d399'; ctx.fillText("k ≈ 0 (빛이 완벽히 직진)", cx, 135);
            } else if (currentCurv > 0) {
                ctx.fillStyle = '#f87171'; ctx.fillText("k > 0 (빛이 휘어지며 모임)", cx, 135);
            } else {
                ctx.fillStyle = '#f87171'; ctx.fillText("k < 0 (빛이 휘어지며 퍼짐)", cx, 135);
            }
        }

        // 지평선 문제: 한 점에서 시작하는 우주 줌-아웃 연출
        function drawHorizon() {
            const cx = cw / 2 - (cw > 1024 ? 150 : 0); 
            const cy = ch / 2 - 30;
            
            // "한 점에서 시작하는" 빅뱅 효과 (Zoom-in from tiny dot)
            let uniScale = 1.0;
            if (time < 5) {
                uniScale = Math.max(0.01, time / 5); // 0.01에서 1.0으로 스케일업
            }
            
            const obsRadius = Math.min(cw, ch) * 0.35;

            ctx.save();
            ctx.translate(cx, cy);
            
            // 한 점 스케일 애니메이션 적용
            ctx.scale(uniScale, uniScale);

            // 관측 가능한 우주 테두리
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2 / uniScale; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.arc(0, 0, obsRadius, 0, Math.PI*2); ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = `${14/uniScale}px Pretendard`; ctx.textAlign = 'center';
            ctx.fillText('현재 관측 가능한 우주 지평선', 0, -obsRadius - 15/uniScale);

            // Galaxy A, B positions & Expansion
            let distA, lightRadius;

            if (currentTheory === 'standard') {
                // 은하가 멀어지는 속도(3.0)가 빛의 속도(1.5)보다 항상 빨라 만나지 못함
                distA = time * 3.0;
                lightRadius = time * 1.5; 
            } else {
                // 초기에 팽창이 느려 빛이 만남
                if (time <= 20) {
                    distA = time * 0.5; // 느린 팽창
                } else if (time <= 35) {
                    let phase = (time - 20) / 15;
                    distA = 20 * 0.5 + Math.pow(phase, 3) * obsRadius * 1.5; // 급팽창으로 우주 끝까지 던져짐
                } else {
                    distA = 20 * 0.5 + obsRadius * 1.5 + ((time - 35) / 65) * 20;
                }
                lightRadius = time * 1.5; 
            }

            const ax = -distA; const ay = 0;
            const bx = distA;  const by = 0;

            // Thermal Equilibrium (Information overlap)
            if (currentTheory === 'inflation' && time > 0 && time <= 20) {
                ctx.fillStyle = 'rgba(250, 204, 21, 0.5)'; 
                ctx.beginPath(); ctx.arc(0, 0, lightRadius * 1.6, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#fde047'; ctx.font = `bold ${13/uniScale}px Pretendard`;
                ctx.fillText('빛과 에너지 교환 완료 (온도 같아짐!)', 0, -40/uniScale);
            }

            // Light from A (Red)
            ctx.fillStyle = 'rgba(239, 68, 68, 0.35)'; 
            ctx.beginPath(); ctx.arc(ax, ay, lightRadius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5/uniScale; ctx.stroke();

            // Light from B (Blue)
            ctx.fillStyle = 'rgba(56, 189, 248, 0.35)'; 
            ctx.beginPath(); ctx.arc(bx, by, lightRadius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#38bdf8'; ctx.stroke();

            // Draw Galaxies
            ctx.fillStyle = '#fca5a5'; ctx.beginPath(); ctx.arc(ax, ay, 6/uniScale, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font=`bold ${14/uniScale}px Pretendard`; ctx.fillText('A 은하', ax, ay + 25/uniScale);
            
            ctx.fillStyle = '#7dd3fc'; ctx.beginPath(); ctx.arc(bx, by, 6/uniScale, 0, Math.PI*2); ctx.fill();
            ctx.fillText('B 은하', bx, by + 25/uniScale);

            // Draw Earth
            ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(0, 0, 4/uniScale, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.fillText('지구 (우리)', 0, 20/uniScale);

            ctx.restore(); // 스케일 원래대로

            // 한 점 폭발 특수효과
            if (time < 2) {
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(cx, cy, 20 - time*10, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 20; ctx.shadowColor = '#fff';
                ctx.fillText('💥 특이점 (빅뱅)', cx, cy - 30);
                ctx.shadowBlur = 0;
            }

            // Dynamic Conclusion Label
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.beginPath(); ctx.roundRect(cx - 160, cy + obsRadius + 20, 320, 50, 8); ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.stroke();
            
            ctx.font = 'bold 15px Pretendard';
            if (time < 2) {
                ctx.fillStyle = '#fff'; ctx.fillText('빅뱅 직후 한 점에서 출발', cx, cy + obsRadius + 50);
            } else if (currentTheory === 'standard') {
                ctx.fillStyle = '#f87171'; ctx.fillText('처음부터 A와 B의 빛(에너지) 교환 불가', cx, cy + obsRadius + 50);
            } else {
                if (time <= 20) {
                    ctx.fillStyle = '#fde047'; ctx.fillText('거리 가까움 (빛 섞이며 열평형 도달 중)', cx, cy + obsRadius + 50);
                } else if(time <= 35) {
                    ctx.fillStyle = '#34d399'; ctx.fillText('초고속 급팽창 발생! (지평선 밖으로 멀어짐)', cx, cy + obsRadius + 50);
                } else {
                    ctx.fillStyle = '#34d399'; ctx.fillText('이미 열평형을 이룬 채로 양 끝단에 존재', cx, cy + obsRadius + 50);
                }
            }
        }

        // 3. Monopole Problem
        function initMonopoles() {
            monopoles.length = 0;
            for(let i=0; i<150; i++) {
                monopoles.push({
                    baseX: (Math.random() - 0.5) * 80,
                    baseY: (Math.random() - 0.5) * 80,
                    type: Math.random() > 0.5 ? 'N' : 'S'
                });
            }
        }

        function drawMonopole() {
            const cx = cw / 2 - (cw > 1024 ? 150 : 0); 
            const cy = ch / 2 - 20;
            
            let scale = getScaleFactor(time, currentTheory);

            const obsRadius = Math.min(cw, ch) * 0.4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - obsRadius, cy - obsRadius, obsRadius*2, obsRadius*2);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '12px Pretendard'; ctx.textAlign = 'center';
            ctx.fillText('우리의 관측 가능한 우주 한계선', cx, cy - obsRadius - 10);

            let visibleCount = 0;

            monopoles.forEach(m => {
                let x = cx + m.baseX * scale;
                let y = cy + m.baseY * scale;

                if (Math.abs(x - cx) < obsRadius && Math.abs(y - cy) < obsRadius) {
                    visibleCount++;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI*2);
                    ctx.fillStyle = m.type === 'N' ? '#ef4444' : '#3b82f6';
                    ctx.fill();
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(m.type, x, y);
                } else if (currentTheory === 'inflation' && time > 20 && time < 40) {
                    // Streaking lines
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(cx + m.baseX * (scale - 5), cy + m.baseY * (scale - 5));
                    ctx.strokeStyle = m.type === 'N' ? 'rgba(239, 68, 68, 0.5)' : 'rgba(59, 130, 246, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Analysis Text
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.beginPath(); ctx.roundRect(cx - 140, cy + obsRadius + 20, 280, 50, 8); ctx.fill();
            ctx.strokeStyle = '#475569'; ctx.stroke();
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Pretendard';
            ctx.fillText(`관측 영역 내 홀극 개수: ${visibleCount} 개`, cx, cy + obsRadius + 40);
            
            if (currentTheory === 'inflation' && visibleCount <= 1 && time > 30) {
                ctx.fillStyle = '#34d399'; ctx.font = '12px Pretendard';
                ctx.fillText('부피 폭증으로 밀도가 0에 수렴함 (해결)', cx, cy + obsRadius + 60);
            } else if (currentTheory === 'standard' && time > 50) {
                ctx.fillStyle = '#f87171'; ctx.font = '12px Pretendard';
                ctx.fillText('높은 밀도가 계속 관측되어야 함 (모순)', cx, cy + obsRadius + 60);
            }
        }

        // --- 6. Main Loop ---
        function draw() {
            ctx.clearRect(0, 0, cw, ch);
            
            document.getElementById('time-val').textContent = time.toFixed(1);
            
            if (currentTheory === 'inflation' && time > 20 && time < 35) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fillRect(0, 0, cw, ch);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px Pretendard';
                ctx.textAlign = 'center';
                ctx.fillText('🚀 급팽창 발생 (Inflation) 🚀', cw/2, ch/2 - 100);
            }

            if (currentMode === 'flatness') drawFlatness();
            else if (currentMode === 'horizon') drawHorizon();
            else if (currentMode === 'monopole') drawMonopole();
        }

        function animate() {
            if (isPlaying) {
                time += 0.1; // 재생 속도를 기존 대비 1/3로 늦춰 매우 부드러움
                if (time > 100) {
                    time = 0;
                    if(currentMode === 'monopole') initMonopoles();
                }
                document.getElementById('timeSlider').value = time;
                draw();
            }
            requestAnimationFrame(animate);
        }

        // Init
        resizeCanvas();
        requestAnimationFrame(animate);

    </script>
</body>
