<cyclone html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 최적화: 줌 방지, 앱 화면처럼 꽉 차게 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 중위도 저기압 (모바일)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* 폰트 및 기본 설정 */
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; background-color: #000; margin: 0; overflow: hidden; }
        
        /* 모바일 전체 화면 대응 (iOS Safari bottom bar 문제 해결) */
        .app-container { height: 100dvh; display: flex; flex-direction: column; background-color: #f0f4f8; }
        
        /* 3D 캔버스 영역 (터치 스크롤 방지 필수) */
        #canvas-container { flex-grow: 1; position: relative; touch-action: none; outline: none; }
        
        /* 하단 컨트롤 패널 UI */
        .bottom-sheet { background: white; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 10; padding-bottom: env(safe-area-inset-bottom); }
        
        /* 스크롤바 숨기기 (버튼 가로 스크롤용) */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 버튼 스타일 */
        .stage-btn { flex: 0 0 80%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; text-align: center; transition: all 0.2s; scroll-snap-align: center; border: 2px solid transparent; }
        .btn-active { background-color: #2563eb; color: white; border-color: #1d4ed8; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4); transform: scale(1.02); }
        .btn-inactive { background-color: #f3f4f6; color: #4b5563; border-color: #d1d5db; }
        
        /* 미니 범례 (우측 상단) */
        .mini-legend { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.85); padding: 8px; border-radius: 8px; font-size: 0.75rem; color: #1f2937; pointer-events: none; border: 1px solid #cbd5e1; backdrop-filter: blur(4px); }
        .color-box { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 헤더 -->
        <header class="bg-white/90 backdrop-blur pt-safe shadow-sm z-10 shrink-0">
            <div class="px-4 py-3 text-center">
                <h1 class="text-xl font-extrabold text-gray-800 tracking-tight">3D 중위도 저기압</h1>
                <p class="text-xs text-gray-500 mt-0.5">화면을 드래그하여 이리저리 돌려보세요 👆</p>
            </div>
        </header>

        <!-- 3D 캔버스 영역 -->
        <main id="canvas-container">
            <div class="mini-legend shadow-sm">
                <div class="font-bold border-b border-gray-300 pb-1 mb-1 text-center">범례</div>
                <div class="flex items-center"><span class="color-box bg-blue-500"></span>찬 공기</div>
                <div class="flex items-center"><span class="color-box bg-red-400"></span>따뜻한 공기</div>
                <div class="flex items-center"><span class="color-box bg-purple-500"></span>전선면</div>
                <div class="flex items-center"><span class="color-box bg-sky-600"></span>제트기류</div>
            </div>
        </main>

        <!-- 하단 조작부 (Bottom Sheet) -->
        <footer class="bottom-sheet shrink-0">
            <!-- 설명 텍스트 -->
            <div class="px-5 py-4 min-h-[90px] flex items-center justify-center border-b border-gray-100 bg-blue-50/50 rounded-t-[20px]">
                <p id="descText" class="text-[0.95rem] font-bold text-blue-900 leading-snug break-keep text-center">
                    [1단계] 무거운 찬 공기가 따뜻한 공기 아래로 파고들어 쐐기 모양의 '정체전선'이 형성됩니다.
                </p>
            </div>

            <!-- 스와이프 버튼 영역 -->
            <div class="w-full relative">
                <div class="absolute top-0 left-0 h-full w-4 bg-gradient-to-r from-white to-transparent z-10 pointer-events-none"></div>
                <div class="absolute top-0 right-0 h-full w-4 bg-gradient-to-l from-white to-transparent z-10 pointer-events-none"></div>
                
                <div class="flex overflow-x-auto gap-3 p-4 hide-scrollbar snap-x snap-mandatory" style="scroll-padding: 1rem;">
                    <button id="btn1" class="stage-btn btn-active" onclick="setStage(1)">1. 정체 전선</button>
                    <button id="btn2" class="stage-btn btn-inactive" onclick="setStage(2)">2. 상층 발산</button>
                    <button id="btn3" class="stage-btn btn-inactive" onclick="setStage(3)">3. 저기압 발달</button>
                    <button id="btn4" class="stage-btn btn-inactive" onclick="setStage(4)">4. 전선 분리</button>
                </div>
            </div>
            <div class="text-center pb-2 text-[0.65rem] text-gray-400 font-medium">단계를 좌우로 스와이프 하세요 ↔️</div>
        </footer>
    </div>

    <script>
        let currentStage = 1;

        // --- 1. Three.js 기본 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 모바일은 배경을 조금 더 산뜻하게
        scene.background = new THREE.Color(0xe8f0fe); 

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        // 모바일(세로 화면)을 위해 카메라를 조금 더 멀고 높게 배치
        camera.position.set(0, 65, 80); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        // 모바일 고해상도 디스플레이 대응 (배터리 보호를 위해 최대 2로 제한)
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2, 0); 
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        // 모바일에서 두 손가락 패닝(Pan) 차단하여 부드러운 회전에 집중
        controls.enablePan = false; 

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(20, 50, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(80, 80, 0x9ca3af, 0xe5e7eb);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- 2. 동적 기단(Air Mass) 형상 생성 ---
        const boxW = 70, boxH = 12, boxD = 35, segs = 70; 

        const coldGeo = new THREE.BoxGeometry(boxW, boxH, boxD, segs, 5, 1).toNonIndexed();
        coldGeo.translate(0, boxH/2, -boxD/2); 
        const coldOrig = Float32Array.from(coldGeo.attributes.position.array);
        const coldMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        const coldMesh = new THREE.Mesh(coldGeo, coldMat);
        scene.add(coldMesh);

        const warmGeo = new THREE.BoxGeometry(boxW, boxH, boxD, segs, 5, 1).toNonIndexed();
        warmGeo.translate(0, boxH/2, boxD/2);
        const warmOrig = Float32Array.from(warmGeo.attributes.position.array);
        const warmMat = new THREE.MeshLambertMaterial({ color: 0xfca5a5, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
        const warmMesh = new THREE.Mesh(warmGeo, warmMat);
        scene.add(warmMesh);

        const frontGeo = new THREE.PlaneGeometry(boxW, boxH, segs, 5).toNonIndexed();
        frontGeo.translate(0, boxH/2, 0);
        const frontOrig = Float32Array.from(frontGeo.attributes.position.array);
        const frontMat = new THREE.MeshLambertMaterial({ color: 0xa855f7, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
        const frontMesh = new THREE.Mesh(frontGeo, frontMat);
        scene.add(frontMesh);

        // --- 3. 굵은 기준선 (지표면 전선) 및 일기도 기호 ---
        const frontLineGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(Array(65).fill(new THREE.Vector3())), 64, 0.4, 8, false);
        const frontLineMat = new THREE.MeshBasicMaterial({ color: 0x1f2937 }); 
        const frontLineMesh = new THREE.Mesh(frontLineGeo, frontLineMat);
        scene.add(frontLineMesh);
        
        // 모바일 화면에서 기호가 잘 보이도록 크기 확대
        const coldShape = new THREE.Shape();
        coldShape.moveTo(0, 3.0); coldShape.lineTo(1.5, 0); coldShape.lineTo(-1.5, 0); coldShape.lineTo(0, 3.0);
        const coldSymGeo = new THREE.ExtrudeGeometry(coldShape, { depth: 0.6, bevelEnabled: false });
        coldSymGeo.rotateX(-Math.PI / 2); coldSymGeo.translate(0, 0.3, 0);  
        const coldSymMat = new THREE.MeshBasicMaterial({ color: 0x0044ff }); 

        const warmShape = new THREE.Shape();
        warmShape.absarc(0, 0, 1.7, 0, Math.PI, false); warmShape.lineTo(1.7, 0); 
        const warmSymGeo = new THREE.ExtrudeGeometry(warmShape, { depth: 0.6, bevelEnabled: false });
        warmSymGeo.rotateX(-Math.PI / 2); warmSymGeo.translate(0, 0.3, 0);
        const warmSymMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });

        const frontMarkers = [];
        for (let x = -32; x <= 32; x += 4.0) { // 간격을 넓혀 모바일에서 덜 지저분하게 조정
            const cMesh = new THREE.Mesh(coldSymGeo, coldSymMat);
            const wMesh = new THREE.Mesh(warmSymGeo, warmSymMat);
            scene.add(cMesh); scene.add(wMesh);
            frontMarkers.push({ x: x, coldMesh: cMesh, warmMesh: wMesh, index: frontMarkers.length });
        }

        // --- 4. 기타 요소들 (화살표, 제트기류, 구름) ---
        const jetCurve = new THREE.CatmullRomCurve3(Array(20).fill(new THREE.Vector3()));
        const jetTubeGeo = new THREE.TubeGeometry(jetCurve, 40, 0.8, 8, false); // 제트기류 두께 증가
        const jetMat = new THREE.MeshLambertMaterial({ color: 0x0284c7, transparent: true, opacity: 0.8 });
        const jetMesh = new THREE.Mesh(jetTubeGeo, jetMat);
        scene.add(jetMesh);

        function createArrow(color, length, thickness=0.7) {
            const group = new THREE.Group();
            const shaftGeo = new THREE.CylinderGeometry(thickness, thickness, length, 12);
            shaftGeo.rotateX(Math.PI / 2); shaftGeo.translate(0, 0, length/2);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const shaft = new THREE.Mesh(shaftGeo, mat);
            const headGeo = new THREE.ConeGeometry(thickness*2.5, thickness*4, 12);
            headGeo.rotateX(Math.PI / 2); headGeo.translate(0, 0, length + thickness*2);
            const head = new THREE.Mesh(headGeo, mat);
            group.add(shaft); group.add(head);
            return group;
        }

        const arrows = {
            coldLeft: createArrow(0x1e3a8a, 12, 0.8),
            warmRight: createArrow(0xb91c1c, 12, 0.8),
            ccw1: createArrow(0x4b5563, 7, 0.5), ccw2: createArrow(0x4b5563, 7, 0.5),
            ccw3: createArrow(0x4b5563, 7, 0.5), ccw4: createArrow(0x4b5563, 7, 0.5),
            expandColdSW: createArrow(0x1d4ed8, 14, 1.0),
            expandWarmSE: createArrow(0xdc2626, 14, 1.0)
        };
        scene.add(arrows.coldLeft, arrows.warmRight);
        scene.add(arrows.ccw1, arrows.ccw2, arrows.ccw3, arrows.ccw4);
        scene.add(arrows.expandColdSW, arrows.expandWarmSE);

        const updraftGroup = new THREE.Group();
        const pGeo = new THREE.SphereGeometry(0.5, 4, 4); // 입자 크기 확대
        const pMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
        for(let i=0; i<30; i++) {
            let p = new THREE.Mesh(pGeo, pMat);
            p.userData = { offset: Math.random() * Math.PI * 2, speed: 0.05 + Math.random()*0.02 };
            updraftGroup.add(p);
        }
        scene.add(updraftGroup);

        function createLabel(text, color, yOffset, scale=12) {
            const cvs = document.createElement('canvas');
            cvs.width = 400; cvs.height = 80;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = color; ctx.font = 'Bold 40px Pretendard, sans-serif';
            ctx.textAlign = 'center'; ctx.fillText(text, 200, 55);
            const tex = new THREE.CanvasTexture(cvs);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(scale, scale*0.2, 1); sprite.position.y = yOffset;
            scene.add(sprite); return sprite;
        }
        const lblL = createLabel("저기압(L)", "#dc2626", 0.5, 15);
        const lblJet = createLabel("제트기류 파동", "#0284c7", 19, 15);

        // 구름 생성
        function createCumulusCloud(scale) {
            const cloud = new THREE.Group();
            const geo = new THREE.SphereGeometry(1, 8, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const positions = [[0,0,0], [0.5,0.5,-0.5], [-0.5,0.8,0.5], [0,1.5,0], [0.2,2.2,-0.2], [-0.2,2.8,0.2], [0,3.5,0]];
            positions.forEach(pos => {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...pos); mesh.scale.setScalar(0.9 + Math.random()*0.4);
                cloud.add(mesh);
            });
            cloud.scale.setScalar(scale);
            scene.add(cloud); return cloud;
        }

        function createStratusCloud(scale) {
            const cloud = new THREE.Group();
            const geo = new THREE.SphereGeometry(1, 8, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0xe5e7eb });
            const positions = [];
            for(let i=0; i<15; i++) {
                positions.push([(Math.random()-0.5)*12, (Math.random()-0.5)*0.8, (Math.random()-0.5)*8]);
            }
            positions.forEach(pos => {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...pos); mesh.scale.set(1.5, 0.4, 1.5);
                cloud.add(mesh);
            });
            cloud.scale.setScalar(scale);
            scene.add(cloud); return cloud;
        }

        const clouds = [
            createCumulusCloud(1.5), 
            createCumulusCloud(1.8), 
            createStratusCloud(1.6), 
            createStratusCloud(2.0)  
        ];
        
        const lblCumulus = createLabel("적운형 (소나기)", "#1e3a8a", 0, 18);
        const lblStratus = createLabel("층운형 (지속비)", "#dc2626", 0, 18);

        // --- 5. 수학적 파동 및 '기본 기울기' 계산 ---
        let currentAmp = 0, targetAmp = 0;

        function getWaveZ(x, amp) {
            if (amp === 0) return 0;
            if (x < 0) return -amp * Math.cos(x * 0.12); 
            return -amp * Math.cos(x * 0.08);            
        }
        
        function getSlope(x, amp) {
            const baseSlope = 0.55; 
            const factor = Math.min(amp / 12, 1.0); 
            
            let dynamicSlope = 0.55;
            if (x < -2) dynamicSlope = 0.25;      
            else if (x > 2) dynamicSlope = 1.7;   
            else {
                let t = (x + 2) / 4;
                dynamicSlope = 0.25 * (1 - t) + 1.7 * t;
            }
            return baseSlope * (1 - factor) + dynamicSlope * factor;
        }

        // --- 6. 애니메이션 루프 ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.03;
            currentAmp += (targetAmp - currentAmp) * 0.05; 

            // 기단체 찌그러트리기
            const cPos = coldMesh.geometry.attributes.position.array;
            for(let i=0; i<cPos.length; i+=3) {
                let x = coldOrig[i]; let y = coldOrig[i+1]; let z = coldOrig[i+2];
                if (z > -1) cPos[i+2] = getWaveZ(x, currentAmp) - (y * getSlope(x, currentAmp));
            }
            coldMesh.geometry.attributes.position.needsUpdate = true;
            coldMesh.geometry.computeVertexNormals();

            const wPos = warmMesh.geometry.attributes.position.array;
            for(let i=0; i<wPos.length; i+=3) {
                let x = warmOrig[i]; let y = warmOrig[i+1]; let z = warmOrig[i+2];
                if (z < 1) wPos[i+2] = getWaveZ(x, currentAmp) - (y * getSlope(x, currentAmp));
            }
            warmMesh.geometry.attributes.position.needsUpdate = true;
            warmMesh.geometry.computeVertexNormals();

            const fPos = frontMesh.geometry.attributes.position.array;
            for(let i=0; i<fPos.length; i+=3) {
                let x = frontOrig[i]; let y = frontOrig[i+1];
                fPos[i+2] = getWaveZ(x, currentAmp) - (y * getSlope(x, currentAmp));
            }
            frontMesh.geometry.attributes.position.needsUpdate = true;
            frontMesh.geometry.computeVertexNormals();

            const linePts = [];
            const yLine = 0.4;
            for(let i=-35; i<=35; i+=1) {
                linePts.push(new THREE.Vector3(i, yLine, getWaveZ(i, currentAmp) - (yLine * getSlope(i, currentAmp))));
            }
            frontLineMesh.geometry.dispose();
            frontLineMesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(linePts), 70, 0.35, 8, false);

            frontMarkers.forEach(m => {
                const yPos = 0.8; 
                const slope = getSlope(m.x, currentAmp);
                const z = getWaveZ(m.x, currentAmp) - (yPos * slope);
                
                const z1 = getWaveZ(m.x - 0.1, currentAmp) - (yPos * getSlope(m.x - 0.1, currentAmp));
                const z2 = getWaveZ(m.x + 0.1, currentAmp) - (yPos * getSlope(m.x + 0.1, currentAmp));
                const tangent = new THREE.Vector3(0.2, 0, z2 - z1).normalize();
                
                const normalCold = new THREE.Vector3(tangent.z, 0, -tangent.x); 
                const normalWarm = new THREE.Vector3(-tangent.z, 0, tangent.x); 

                m.coldMesh.position.set(m.x, yPos, z);
                m.coldMesh.lookAt(m.x + normalCold.x, yPos, z + normalCold.z);
                
                m.warmMesh.position.set(m.x, yPos, z);
                m.warmMesh.lookAt(m.x + normalWarm.x, yPos, z + normalWarm.z);

                m.coldMesh.visible = false;
                m.warmMesh.visible = false;

                if (currentStage <= 2) {
                    if (m.index % 2 === 0) m.coldMesh.visible = true;
                    else m.warmMesh.visible = true;
                } else {
                    if (m.x < -1.5) m.coldMesh.visible = true;
                    else if (m.x > 1.5) m.warmMesh.visible = true;
                }
            });

            // 제트기류
            const jetPts = [];
            for(let i=-30; i<=30; i++) {
                let x = i * 1.5;
                let z = -currentAmp * 1.5 * Math.cos((x + 5) * 0.1); 
                jetPts.push(new THREE.Vector3(x, 17, z));
            }
            jetMesh.geometry.dispose();
            jetMesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(jetPts), 60, 0.8, 8, false);

            const centerZ = getWaveZ(0, currentAmp);

            if (currentStage === 1) {
                arrows.warmRight.position.set(-8 + (time*4)%16, 2.5, 8);
                arrows.warmRight.lookAt(100, 2.5, 8);
                arrows.coldLeft.position.set(8 - (time*4)%16, 2.5, -8);
                arrows.coldLeft.lookAt(-100, 2.5, -8);
            }

            if (currentStage >= 2) {
                const targetJetZ = -currentAmp * 1.5 * Math.cos(5 * 0.1); 
                updraftGroup.children.forEach(p => {
                    p.userData.offset += p.userData.speed;
                    let t = (p.userData.offset % (Math.PI*2)) / (Math.PI*2);
                    let px = Math.sin(p.userData.offset * 3) * 2; 
                    let py = t * 17; 
                    let pz = THREE.MathUtils.lerp(centerZ, targetJetZ, t) + Math.cos(p.userData.offset * 3) * 2;
                    p.position.set(px, py, pz);
                });
                lblJet.position.z = targetJetZ - 2;
            }

            if (currentStage >= 3) {
                const r = 6 + currentAmp * 0.2; 
                const tSpeed = time * 1.5;
                [[arrows.ccw1, 0], [arrows.ccw2, Math.PI/2], [arrows.ccw3, Math.PI], [arrows.ccw4, Math.PI*1.5]].forEach(([arrow, offset]) => {
                    let angle = -tSpeed + offset; 
                    let ax = Math.cos(angle) * r;
                    let az = centerZ + Math.sin(angle) * r;
                    arrow.position.set(ax, 1.5, az);
                    let nextAngle = angle - 0.1;
                    arrow.lookAt(Math.cos(nextAngle)*r, 1.5, centerZ + Math.sin(nextAngle)*r); 
                });
                lblL.position.z = centerZ + 1;
            }

            if (currentStage === 4) {
                arrows.expandColdSW.position.set(-2, 1.5, centerZ - 5);
                arrows.expandColdSW.lookAt(-16, 1.5, centerZ + 15);
                arrows.expandWarmSE.position.set(0, 3, centerZ + 4);
                arrows.expandWarmSE.lookAt(18, 5, centerZ - 8); 

                let c0x = -9, c0y = 2.5;
                clouds[0].position.set(c0x, c0y, getWaveZ(c0x, currentAmp) - (c0y * getSlope(c0x, currentAmp)) - 1.5);
                let c1x = -15, c1y = 2.5;
                clouds[1].position.set(c1x, c1y, getWaveZ(c1x, currentAmp) - (c1y * getSlope(c1x, currentAmp)) - 2.0);
                
                let c2x = 10, c2y = 5;
                clouds[2].position.set(c2x, c2y, getWaveZ(c2x, currentAmp) - (c2y * getSlope(c2x, currentAmp)) - 2.5);
                let c3x = 22, c3y = 7;
                clouds[3].position.set(c3x, c3y, getWaveZ(c3x, currentAmp) - (c3y * getSlope(c3x, currentAmp)) - 3.0);

                lblCumulus.position.set(-12, 12, getWaveZ(-12, currentAmp) - (12 * getSlope(-12, currentAmp)));
                lblStratus.position.set(16, 13, getWaveZ(16, currentAmp) - (13 * getSlope(16, currentAmp)));
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // 모바일 화면 회전(가로/세로) 완벽 대응
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            
            // 세로 모드일 때 뷰가 너무 잘리지 않도록 FOV 자동 조절
            if(width < height) {
                camera.fov = 60; // 세로일때 시야각 넓히기
            } else {
                camera.fov = 45; // 가로일때 시야각 좁히기
            }
            
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
        
        // 초기 로드 시 리사이즈 이벤트 강제 트리거 (초기 모바일 화면비 맞춤)
        window.dispatchEvent(new Event('resize'));

        const descriptions = [
            "[1단계] 무거운 찬 공기가 따뜻한 공기 아래로 쐐기처럼 파고들어 '정체전선'이 형성됩니다. 지그재그 기호가 나타납니다.",
            "[2단계] 하늘 위 제트기류 파동에 의해 중심 공기가 상승합니다(상층 발산). 정체전선이 서서히 일그러집니다.",
            "[3단계] 지표면에 '저기압(L)'이 발생하고, 주변 공기가 거세게 반시계 방향으로 회전하며 빨려 들어옵니다.",
            "[4단계] 전선이 분리됩니다! 한랭전선(적운형)은 남서쪽으로, 온난전선(층운형)은 남동쪽으로 확장합니다."
        ];

        window.setStage = function(stage) {
            currentStage = stage;
            
            // 모바일 스와이프 버튼 활성화 효과
            const buttons = document.querySelectorAll('.stage-btn');
            buttons.forEach((btn, index) => {
                if (index + 1 === stage) {
                    btn.classList.replace('btn-inactive', 'btn-active');
                    // 클릭 시 해당 버튼이 모바일 화면 중앙으로 오도록 스크롤 이동
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    btn.classList.replace('btn-active', 'btn-inactive');
                }
            });
            
            document.getElementById('descText').innerText = descriptions[stage - 1];

            targetAmp = [0, 0, 5, 10, 16][stage];

            arrows.coldLeft.visible = (stage === 1);
            arrows.warmRight.visible = (stage === 1);
            
            jetMesh.visible = (stage >= 2);
            lblJet.visible = (stage >= 2);
            updraftGroup.visible = (stage >= 2);

            [arrows.ccw1, arrows.ccw2, arrows.ccw3, arrows.ccw4, lblL].forEach(el => el.visible = (stage >= 3));

            arrows.expandColdSW.visible = (stage === 4);
            arrows.expandWarmSE.visible = (stage === 4);
            clouds.forEach(c => c.visible = (stage === 4));
            lblCumulus.visible = (stage === 4);
            lblStratus.visible = (stage === 4);
        };

        setStage(1);
        animate();
    </script>
</body>
</html>
