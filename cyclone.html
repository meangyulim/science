<cyclone html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 최적화: 확대 방지, 화면 꽉 차게 고정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 중위도 저기압 (모바일 앱 버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #e8f0fe; 
            margin: 0; 
            padding: 0;
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            position: fixed; 
            touch-action: none; 
        }
        
        #canvas-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 1; 
        }

        .ui-layer { 
            position: absolute; 
            left: 0; 
            width: 100%; 
            z-index: 10; 
            pointer-events: none; 
        }
        
        .ui-interactive { 
            pointer-events: auto; 
        }

        .top-bar { top: env(safe-area-inset-top, 10px); padding: 10px 15px; display: flex; justify-content: space-between; align-items: flex-start; }
        
        .legend-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); border-radius: 10px; padding: 8px 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-size: 0.75rem; color: #374151; border: 1px solid rgba(255,255,255,0.5); }
        .color-mark { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

        .bottom-panel { 
            bottom: 0; 
            background: linear-gradient(to top, rgba(255,255,255,1) 70%, rgba(255,255,255,0)); 
            padding-top: 30px;
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }

        .desc-box { background: rgba(255, 255, 255, 0.95); border: 1px solid #bfdbfe; border-radius: 12px; margin: 0 15px 10px 15px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }

        .btn-scroll-container { display: flex; overflow-x: auto; gap: 10px; padding: 5px 15px 15px 15px; scroll-snap-type: x mandatory; }
        .btn-scroll-container::-webkit-scrollbar { display: none; } 
        
        .stage-btn { 
            flex: 0 0 75%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 1rem; 
            scroll-snap-align: center; 
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 2px solid transparent;
        }
        .btn-active { background-color: #2563eb; color: white; border-color: #1d4ed8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }
        .btn-inactive { background-color: #ffffff; color: #4b5563; border-color: #e5e7eb; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer top-bar">
        <div class="ui-interactive" style="text-shadow: 0 2px 4px rgba(255,255,255,0.8);">
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight leading-none">중위도 저기압</h1>
            <p class="text-sm font-semibold text-blue-600 mt-1">👆 3D 회전 (드래그)</p>
        </div>
        <div class="ui-interactive legend-box">
            <div class="font-bold border-b border-gray-200 pb-1 mb-1 text-center">범례</div>
            <div><span class="color-mark bg-blue-500"></span>찬 공기</div>
            <div><span class="color-mark bg-red-400"></span>따뜻한 공기</div>
            <div><span class="color-mark bg-purple-500"></span>전선면</div>
            <div><span class="color-mark bg-sky-600"></span>제트기류</div>
        </div>
    </div>

    <div class="ui-layer bottom-panel ui-interactive">
        <div class="desc-box">
            <p id="descText" class="text-[0.95rem] font-bold text-blue-900 leading-snug break-keep">
                [1단계] 무거운 찬 공기가 따뜻한 공기 아래로 파고들어 비스듬히 기울어진 쐐기 모양의 '정체전선'을 보여줍니다.
            </p>
        </div>

        <div class="relative">
            <div id="btnContainer" class="btn-scroll-container hide-scrollbar">
                <button id="btn1" class="stage-btn btn-active" onclick="setStage(1)">1. 정체 전선</button>
                <button id="btn2" class="stage-btn btn-inactive" onclick="setStage(2)">2. 제트기류 파동</button>
                <button id="btn3" class="stage-btn btn-inactive" onclick="setStage(3)">3. 반시계 회전</button>
                <button id="btn4" class="stage-btn btn-inactive" onclick="setStage(4)">4. 전선 분리 완료</button>
            </div>
        </div>
    </div>

    <script>
        let currentStage = 1;

        // --- 1. Three.js 기본 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8f0fe);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 75, 75); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 5, 0); 
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.enablePan = false; 

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(20, 50, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(90, 90, 0x9ca3af, 0xd1d5db);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- 2. 동적 기단(Air Mass) 형상 생성 ---
        const boxW = 80, boxH = 14, boxD = 40, segs = 60; 

        const coldGeo = new THREE.BoxGeometry(boxW, boxH, boxD, segs, 5, 1).toNonIndexed();
        coldGeo.translate(0, boxH/2, -boxD/2); 
        const coldOrig = Float32Array.from(coldGeo.attributes.position.array);
        const coldMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        const coldMesh = new THREE.Mesh(coldGeo, coldMat);
        scene.add(coldMesh);

        const warmGeo = new THREE.BoxGeometry(boxW, boxH, boxD, segs, 5, 1).toNonIndexed();
        warmGeo.translate(0, boxH/2, boxD/2);
        const warmOrig = Float32Array.from(warmGeo.attributes.position.array);
        const warmMat = new THREE.MeshLambertMaterial({ color: 0xfca5a5, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
        const warmMesh = new THREE.Mesh(warmGeo, warmMat);
        scene.add(warmMesh);

        // [피드백 적용] 전선면을 훨씬 투명하게 (opacity: 0.25)
        const frontGeo = new THREE.PlaneGeometry(boxW, boxH, segs, 5).toNonIndexed();
        frontGeo.translate(0, boxH/2, 0);
        const frontOrig = Float32Array.from(frontGeo.attributes.position.array);
        const frontMat = new THREE.MeshLambertMaterial({ color: 0xa855f7, transparent: true, opacity: 0.20, side: THREE.DoubleSide, depthWrite: false });
        const frontMesh = new THREE.Mesh(frontGeo, frontMat);
        scene.add(frontMesh);

        // --- 3. 굵은 기준선 (지표면 전선) 및 일기도 기호 ---
        const frontLineGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(Array(65).fill(new THREE.Vector3())), 64, 0.4, 8, false);
        const frontLineMat = new THREE.MeshBasicMaterial({ color: 0x1f2937 }); 
        const frontLineMesh = new THREE.Mesh(frontLineGeo, frontLineMat);
        scene.add(frontLineMesh);
        
        const coldShape = new THREE.Shape();
        coldShape.moveTo(0, 3.5); coldShape.lineTo(1.6, 0); coldShape.lineTo(-1.6, 0); coldShape.lineTo(0, 3.5);
        const coldSymGeo = new THREE.ExtrudeGeometry(coldShape, { depth: 0.6, bevelEnabled: false });
        coldSymGeo.rotateX(-Math.PI / 2); coldSymGeo.translate(0, 0.3, 0);  
        const coldSymMat = new THREE.MeshBasicMaterial({ color: 0x0044ff }); 

        const warmShape = new THREE.Shape();
        warmShape.absarc(0, 0, 1.8, 0, Math.PI, false); warmShape.lineTo(1.8, 0); 
        const warmSymGeo = new THREE.ExtrudeGeometry(warmShape, { depth: 0.6, bevelEnabled: false });
        warmSymGeo.rotateX(-Math.PI / 2); warmSymGeo.translate(0, 0.3, 0);
        const warmSymMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });

        const frontMarkers = [];
        for (let x = -36; x <= 36; x += 4.5) { 
            const cMesh = new THREE.Mesh(coldSymGeo, coldSymMat);
            const wMesh = new THREE.Mesh(warmSymGeo, warmSymMat);
            scene.add(cMesh); scene.add(wMesh);
            frontMarkers.push({ x: x, coldMesh: cMesh, warmMesh: wMesh, index: frontMarkers.length });
        }

        // --- 4. 기타 시각적 요소들 (제트기류, 화살표, 구름) ---
        const jetCurve = new THREE.CatmullRomCurve3(Array(20).fill(new THREE.Vector3()));
        const jetTubeGeo = new THREE.TubeGeometry(jetCurve, 40, 1.0, 8, false); 
        const jetMat = new THREE.MeshLambertMaterial({ color: 0x0284c7, transparent: true, opacity: 0.8 });
        const jetMesh = new THREE.Mesh(jetTubeGeo, jetMat);
        scene.add(jetMesh);

        function createArrow(color, length, thickness=0.8) {
            const group = new THREE.Group();
            const shaftGeo = new THREE.CylinderGeometry(thickness, thickness, length, 12);
            shaftGeo.rotateX(Math.PI / 2); shaftGeo.translate(0, 0, length/2);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const shaft = new THREE.Mesh(shaftGeo, mat);
            const headGeo = new THREE.ConeGeometry(thickness*2.5, thickness*3.5, 12);
            headGeo.rotateX(Math.PI / 2); headGeo.translate(0, 0, length + thickness*1.5);
            const head = new THREE.Mesh(headGeo, mat);
            group.add(shaft); group.add(head);
            return group;
        }

        const arrows = {
            coldLeft: createArrow(0x1e3a8a, 14, 0.9), warmRight: createArrow(0xb91c1c, 14, 0.9),
            ccw1: createArrow(0x4b5563, 8, 0.6), ccw2: createArrow(0x4b5563, 8, 0.6),
            ccw3: createArrow(0x4b5563, 8, 0.6), ccw4: createArrow(0x4b5563, 8, 0.6),
            expandColdSW: createArrow(0x1d4ed8, 16, 1.2), expandWarmSE: createArrow(0xdc2626, 16, 1.2)
        };
        scene.add(arrows.coldLeft, arrows.warmRight, arrows.ccw1, arrows.ccw2, arrows.ccw3, arrows.ccw4, arrows.expandColdSW, arrows.expandWarmSE);

        // [피드백 적용] 제트기류 화살표 개수 증가 및 간격 조정 (수렴/발산 뚜렷하게)
        const jetFlowArrows = [];
        for(let i=0; i<24; i++) {
            let arrow = createArrow(0x0ea5e9, 3.5, 0.4); 
            arrow.userData = { offset: i * (70 / 24), side: (i % 3) - 1 }; 
            scene.add(arrow); jetFlowArrows.push(arrow);
        }

        const updraftGroup = new THREE.Group();
        const pGeo = new THREE.SphereGeometry(0.5, 4, 4); 
        const pMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
        for(let i=0; i<35; i++) {
            let p = new THREE.Mesh(pGeo, pMat);
            p.userData = { offset: Math.random() * Math.PI * 2, speed: 0.04 + Math.random()*0.03 };
            updraftGroup.add(p);
        }
        scene.add(updraftGroup);

        function createLabel(text, color, yOffset, scale=18) {
            const cvs = document.createElement('canvas');
            cvs.width = 512; cvs.height = 100;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = color; ctx.font = 'Bold 48px Pretendard, sans-serif';
            ctx.textAlign = 'center'; ctx.fillText(text, 256, 65);
            const tex = new THREE.CanvasTexture(cvs);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(scale, scale*0.2, 1); sprite.position.y = yOffset;
            scene.add(sprite); return sprite;
        }
        const lblL = createLabel("저기압(L)", "#dc2626", 0.5, 20);
        const lblJet = createLabel("제트기류 파동", "#0284c7", 22, 22);

        function createCumulusCloud(scale) {
            const cloud = new THREE.Group();
            const geo = new THREE.SphereGeometry(1, 8, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const positions = [[0,0,0], [0.5,0.5,-0.5], [-0.5,0.8,0.5], [0,1.5,0], [0.2,2.2,-0.2], [-0.2,2.8,0.2], [0,3.5,0]];
            positions.forEach(pos => {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...pos); mesh.scale.setScalar(0.9 + Math.random()*0.4);
                cloud.add(mesh);
            });
            cloud.scale.setScalar(scale);
            scene.add(cloud); return cloud;
        }

        function createStratusCloud(scale) {
            const cloud = new THREE.Group();
            const geo = new THREE.SphereGeometry(1, 8, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0xe5e7eb });
            const positions = [];
            for(let i=0; i<15; i++) {
                positions.push([(Math.random()-0.5)*12, (Math.random()-0.5)*0.8, (Math.random()-0.5)*8]);
            }
            positions.forEach(pos => {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...pos); mesh.scale.set(1.5, 0.4, 1.5);
                cloud.add(mesh);
            });
            cloud.scale.setScalar(scale);
            scene.add(cloud); return cloud;
        }

        const clouds = [
            createCumulusCloud(1.5), createCumulusCloud(1.8), 
            createStratusCloud(1.8), createStratusCloud(2.2)  
        ];
        
        const lblCumulus = createLabel("적운형 (소나기)", "#1e3a8a", 0, 25);
        const lblStratus = createLabel("층운형 (이슬비)", "#dc2626", 0, 25);

        // --- 5. 수학적 파동 및 기울기 계산 ---
        let currentAmp = 0, targetAmp = 0;

        function getWaveZ(x, amp) {
            if (amp === 0) return 0;
            if (x < 0) return -amp * Math.cos(x * 0.1); 
            return -amp * Math.cos(x * 0.07);            
        }
        
        function getSlope(x, amp) {
            const baseSlope = 0.55; 
            const factor = Math.min(amp / 15, 1.0); 
            
            let dynamicSlope = 0.55;
            if (x < -2) dynamicSlope = 0.25;      
            else if (x > 2) dynamicSlope = 1.7;   
            else {
                let t = (x + 2) / 4;
                dynamicSlope = 0.25 * (1 - t) + 1.7 * t;
            }
            return baseSlope * (1 - factor) + dynamicSlope * factor;
        }

        // --- 6. 애니메이션 루프 ---
        let time = 0;
        // 형상을 마지막으로 만들어 둔 진폭. NaN이라 첫 프레임에는 반드시 한 번 생성된다
        let lastBuiltAmp = NaN;
        // 주사율(60Hz/120Hz)과 무관하게 같은 속도로 재생하기 위한 델타 타임
        let lastFrame = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);

            if (now === undefined) now = performance.now();
            // 60fps 한 프레임을 1.0으로 보는 배율. 탭 복귀 시 튀지 않도록 상한을 둔다
            const dt = Math.min((now - lastFrame) / (1000 / 60), 4);
            lastFrame = now;

            time += 0.03 * dt;
            currentAmp += (targetAmp - currentAmp) * (1 - Math.pow(1 - 0.05, dt));
            // 점근 수렴이라 그냥 두면 영원히 끝나지 않는다. 충분히 가까우면 목표값에 붙여 정지시킨다
            if (Math.abs(targetAmp - currentAmp) < 1e-3) currentAmp = targetAmp;

            // 진폭이 실제로 변한 프레임에만 지오메트리를 다시 만든다.
            // (정지 상태에서 매 프레임 TubeGeometry 2개를 새로 할당하던 것을 막는다)
            if (currentAmp !== lastBuiltAmp) {
                lastBuiltAmp = currentAmp;

                // 기단 변형
                const cPos = coldMesh.geometry.attributes.position.array;
                for(let i=0; i<cPos.length; i+=3) {
                    let x = coldOrig[i]; let y = coldOrig[i+1]; let z = coldOrig[i+2];
                    if (z > -1) cPos[i+2] = getWaveZ(x, currentAmp) - (y * getSlope(x, currentAmp));
                }
                coldMesh.geometry.attributes.position.needsUpdate = true;
                coldMesh.geometry.computeVertexNormals();

                const wPos = warmMesh.geometry.attributes.position.array;
                for(let i=0; i<wPos.length; i+=3) {
                    let x = warmOrig[i]; let y = warmOrig[i+1]; let z = warmOrig[i+2];
                    if (z < 1) wPos[i+2] = getWaveZ(x, currentAmp) - (y * getSlope(x, currentAmp));
                }
                warmMesh.geometry.attributes.position.needsUpdate = true;
                warmMesh.geometry.computeVertexNormals();

                const fPos = frontMesh.geometry.attributes.position.array;
                for(let i=0; i<fPos.length; i+=3) {
                    let x = frontOrig[i]; let y = frontOrig[i+1];
                    fPos[i+2] = getWaveZ(x, currentAmp) - (y * getSlope(x, currentAmp));
                }
                frontMesh.geometry.attributes.position.needsUpdate = true;
                frontMesh.geometry.computeVertexNormals();

                // 바닥 선
                const linePts = [];
                const yLine = 0.4;
                for(let i=-40; i<=40; i+=1) {
                    linePts.push(new THREE.Vector3(i, yLine, getWaveZ(i, currentAmp) - (yLine * getSlope(i, currentAmp))));
                }
                frontLineMesh.geometry.dispose();
                frontLineMesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(linePts), 70, 0.35, 8, false);
                // 제트기류
                const jetPts = [];
                for(let i=-35; i<=35; i++) {
                    let x = i * 1.5;
                    let z = -currentAmp * 1.5 * Math.cos((x + 5) * 0.1); 
                    jetPts.push(new THREE.Vector3(x, 20, z)); 
                }
                jetMesh.geometry.dispose();
                jetMesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(jetPts), 70, 0.8, 8, false);
            }

            // 기호 배치
            frontMarkers.forEach(m => {
                const yPos = 0.8; 
                const slope = getSlope(m.x, currentAmp);
                const z = getWaveZ(m.x, currentAmp) - (yPos * slope);
                
                const z1 = getWaveZ(m.x - 0.1, currentAmp) - (yPos * getSlope(m.x - 0.1, currentAmp));
                const z2 = getWaveZ(m.x + 0.1, currentAmp) - (yPos * getSlope(m.x + 0.1, currentAmp));
                const tangent = new THREE.Vector3(0.2, 0, z2 - z1).normalize();
                
                const normalCold = new THREE.Vector3(tangent.z, 0, -tangent.x); 
                const normalWarm = new THREE.Vector3(-tangent.z, 0, tangent.x); 

                m.coldMesh.position.set(m.x, yPos, z);
                m.coldMesh.lookAt(m.x + normalCold.x, yPos, z + normalCold.z);
                
                m.warmMesh.position.set(m.x, yPos, z);
                m.warmMesh.lookAt(m.x + normalWarm.x, yPos, z + normalWarm.z);

                m.coldMesh.visible = false; m.warmMesh.visible = false;

                if (currentStage <= 2) {
                    if (m.index % 2 === 0) m.coldMesh.visible = true; else m.warmMesh.visible = true;
                } else {
                    if (m.x < -1.5) m.coldMesh.visible = true; else if (m.x > 1.5) m.warmMesh.visible = true;
                }
            });

            const centerZ = getWaveZ(0, currentAmp);

            if (currentStage === 1) {
                arrows.warmRight.position.set(-10 + (time*5)%20, 2.5, 8); arrows.warmRight.lookAt(100, 2.5, 8);
                arrows.coldLeft.position.set(10 - (time*5)%20, 2.5, -8); arrows.coldLeft.lookAt(-100, 2.5, -8);
            }

            if (currentStage >= 2) {
                const targetJetZ = -currentAmp * 1.5 * Math.cos(5 * 0.1); 
                
                // [피드백 적용] 제트기류 수렴(느려짐) 및 발산(빨라짐/퍼짐) 역학 시각화
                jetFlowArrows.forEach(arrow => {
                    let px_current = (arrow.userData.offset % 70) - 35;
                    
                    // 기압골(x=-5)을 기준으로 서쪽(x < -5)은 수렴하여 느려지고, 동쪽(x >= -5)은 발산하며 가속
                    let dynamicSpeed = 0.3 + 0.2 * Math.sin((px_current + 5) * 0.15);
                    if (dynamicSpeed < 0.1) dynamicSpeed = 0.1; // 최소 속도 보장
                    
                    arrow.userData.offset += dynamicSpeed * dt;
                    
                    let px = (arrow.userData.offset % 70) - 35; 
                    let spread = 0;
                    
                    // 수렴역 (기압골 후면, x < -5): 화살표들이 가운데로 살짝 모이는 느낌
                    if (px < -5 && px > -25) {
                        let convProgress = (px + 25) / 20;
                        spread = -Math.sin(convProgress * Math.PI) * 1.2;
                    }
                    // 발산역 (기압골 전면, x >= -5): 화살표들이 양옆으로 강하게 퍼짐
                    else if (px >= -5 && px < 25) {
                        let divProgress = (px + 5) / 30; 
                        spread = Math.sin(divProgress * Math.PI) * 5.0;
                    }

                    let pz = -currentAmp * 1.5 * Math.cos((px + 5) * 0.1) + spread * arrow.userData.side;
                    
                    // 방향 계산용 (살짝 앞선 위치)
                    let npx = px + 0.5; let nspread = 0;
                    if (npx < -5 && npx > -25) {
                        let nconvProgress = (npx + 25) / 20;
                        nspread = -Math.sin(nconvProgress * Math.PI) * 1.2;
                    } else if (npx >= -5 && npx < 25) {
                        let nprogress = (npx + 5) / 30; 
                        nspread = Math.sin(nprogress * Math.PI) * 5.0;
                    }
                    let npz = -currentAmp * 1.5 * Math.cos((npx + 5) * 0.1) + nspread * arrow.userData.side;

                    arrow.position.set(px, 20, pz); 
                    arrow.lookAt(npx, 20, npz);
                    arrow.visible = true;
                });

                updraftGroup.children.forEach(p => {
                    p.userData.offset += p.userData.speed * dt;
                    let t = (p.userData.offset % (Math.PI*2)) / (Math.PI*2);
                    let px = Math.sin(p.userData.offset * 3) * 2.5; 
                    let py = t * 21; 
                    let pz = THREE.MathUtils.lerp(centerZ, targetJetZ, t) + Math.cos(p.userData.offset * 3) * 2.5;
                    
                    if (py > 16) {
                        let blend = (py - 16) / 5; 
                        px += blend * 6; 
                        let side = (p.userData.offset % 2 > 1) ? 1 : -1;
                        pz += blend * side * 5; 
                    }
                    p.position.set(px, py, pz);
                });
                lblJet.position.set(0, 22, targetJetZ - 2);
            } else {
                jetFlowArrows.forEach(a => a.visible = false);
            }

            if (currentStage >= 3) {
                const r = 7 + currentAmp * 0.2; 
                const tSpeed = time * 1.5;
                [[arrows.ccw1, 0], [arrows.ccw2, Math.PI/2], [arrows.ccw3, Math.PI], [arrows.ccw4, Math.PI*1.5]].forEach(([arrow, offset]) => {
                    let angle = -tSpeed + offset; 
                    let ax = Math.cos(angle) * r;
                    let az = centerZ + Math.sin(angle) * r;
                    arrow.position.set(ax, 1.5, az);
                    let nextAngle = angle - 0.1;
                    arrow.lookAt(Math.cos(nextAngle)*r, 1.5, centerZ + Math.sin(nextAngle)*r); 
                });
                lblL.position.z = centerZ + 1;
            }

            if (currentStage === 4) {
                arrows.expandColdSW.position.set(-2, 1.5, centerZ - 5);
                arrows.expandColdSW.lookAt(-18, 1.5, centerZ + 18);
                arrows.expandWarmSE.position.set(0, 3, centerZ + 4);
                arrows.expandWarmSE.lookAt(20, 5, centerZ - 10); 

                let c0x = -12, c0y = 2.5;
                clouds[0].position.set(c0x, c0y, getWaveZ(c0x, currentAmp) - (c0y * getSlope(c0x, currentAmp)) - 1.5);
                let c1x = -18, c1y = 2.5;
                clouds[1].position.set(c1x, c1y, getWaveZ(c1x, currentAmp) - (c1y * getSlope(c1x, currentAmp)) - 2.0);
                
                let c2x = 12, c2y = 5;
                clouds[2].position.set(c2x, c2y, getWaveZ(c2x, currentAmp) - (c2y * getSlope(c2x, currentAmp)) - 2.5);
                let c3x = 24, c3y = 7;
                clouds[3].position.set(c3x, c3y, getWaveZ(c3x, currentAmp) - (c3y * getSlope(c3x, currentAmp)) - 3.0);

                lblCumulus.position.set(-15, 12, getWaveZ(-15, currentAmp) - (12 * getSlope(-15, currentAmp)));
                lblStratus.position.set(18, 13, getWaveZ(18, currentAmp) - (13 * getSlope(18, currentAmp)));
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            
            if(width < height) camera.fov = 55;
            else camera.fov = 40;
            
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
        window.dispatchEvent(new Event('resize'));

        const descriptions = [
            "[1단계] 무거운 찬 공기가 밑으로 깔려 전선면이 비스듬한 쐐기 모양(정체전선)을 이룹니다.",
            "[2단계] 제트기류 수렴/발산 역학! 기압골 뒤쪽에서 공기가 모여들며(느려짐) 전면에서 빠르게 퍼져나갑니다(발산). 이로 인해 상승기류가 폭발합니다.",
            "[3단계] 지표면에 강한 저기압(L)이 생기고, 주변 공기가 시계 반대 방향(반시계)으로 거세게 회전하며 빨려 들어옵니다.",
            "[4단계] 한랭전선(적운형, 남서쪽)과 온난전선(층운형, 남동쪽)이 완벽히 분리되어 세력을 확장합니다."
        ];

        window.setStage = function(stage) {
            currentStage = stage;
            
            const container = document.getElementById('btnContainer');
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`btn${i}`);
                if (i === stage) {
                    btn.classList.replace('btn-inactive', 'btn-active');
                    const scrollPos = btn.offsetLeft - (container.clientWidth / 2) + (btn.clientWidth / 2);
                    container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                } else {
                    btn.classList.replace('btn-active', 'btn-inactive');
                }
            }
            
            document.getElementById('descText').innerText = descriptions[stage - 1];

            targetAmp = [0, 0, 6, 12, 18][stage]; 

            arrows.coldLeft.visible = (stage === 1);
            arrows.warmRight.visible = (stage === 1);
            
            jetMesh.visible = (stage >= 2);
            lblJet.visible = (stage >= 2);
            updraftGroup.visible = (stage >= 2);

            [arrows.ccw1, arrows.ccw2, arrows.ccw3, arrows.ccw4, lblL].forEach(el => el.visible = (stage >= 3));

            arrows.expandColdSW.visible = (stage === 4);
            arrows.expandWarmSE.visible = (stage === 4);
            clouds.forEach(c => c.visible = (stage === 4));
            lblCumulus.visible = (stage === 4);
            lblStratus.visible = (stage === 4);
        };

        setStage(1);
        animate();
    </script>
</body>
</html>
