<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>학습지 내려받기 — 민규쌤의 과학 실험실</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  html, body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; margin: 0; }

  /* 학교망에서 Tailwind CDN 이 막히는 경우가 있다. 그때도 학습지를 받을 수 있도록
     꼭 필요한 모양은 Tailwind 클래스가 아니라 아래 규칙으로 직접 잡아 둔다. */
  .ws-card   { background:#fff; border:1px solid #e2e8f0; border-radius:16px;
               padding:16px; margin-bottom:12px; }
  .ws-btns   { display:flex; gap:8px; margin-top:16px; }
  .ws-btn    { flex:1; text-align:center; padding:11px 0; border-radius:12px;
               font-weight:700; font-size:14px; text-decoration:none; display:block; }
  .ws-btn-dl { background:#4f46e5; color:#fff; }
  .ws-btn-vw { background:#fff; color:#334155; border:1px solid #cbd5e1; }
  .ws-btns-video { margin-top:8px; }
  .ws-btn-video  { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa;
                   font-size:13px; padding:9px 0; }

  .ws-notice      { background:#eef2ff; border:1px solid #c7d2fe; border-radius:16px;
                    padding:14px 16px; margin-bottom:16px; }
  .ws-notice-head { margin:0 0 9px; font-size:13px; font-weight:700; color:#4338ca; }
  .ws-notice-list { margin:0; padding:0; list-style:none; }
  .ws-notice-item { display:flex; gap:10px; font-size:13px; color:#3730a3;
                    line-height:1.55; padding:2px 0; word-break:keep-all; }
  .ws-notice-date { flex:none; font-weight:700; color:#6366f1;
                    font-variant-numeric:tabular-nums; }
  .ws-new         { display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
                    background:#4f46e5; color:#fff; font-size:10px; font-weight:700;
                    vertical-align:middle; letter-spacing:.04em; }
  .ws-revised     { background:#b45309; }
  .ws-changes                 { background:#f8fafc; border-color:#e2e8f0; }
  .ws-changes .ws-notice-head { color:#475569; }
  .ws-changes .ws-notice-item { color:#475569; }
  .ws-changes .ws-notice-date { color:#64748b; }
  .ws-changes .ws-notice-sub li { color:#64748b; }
  .ws-notice-body { flex:1; min-width:0; }
  .ws-notice-sub  { margin:5px 0 0; padding:0; list-style:none; }
  .ws-notice-sub li { position:relative; padding-left:12px; font-size:12.5px;
                      color:#4338ca; line-height:1.5; margin-top:2px; }
  .ws-notice-sub li::before { content:"·"; position:absolute; left:3px; font-weight:700; }
  .ws-archive { margin-top:20px; border:1px solid #e2e8f0; border-radius:16px; background:#f8fafc; }
  .ws-archive > summary { cursor:pointer; padding:14px 16px; font-weight:700; font-size:14px;
                          color:#475569; list-style:none; }
  .ws-archive > summary::-webkit-details-marker { display:none; }
  .ws-archive > summary::before { content:"▸"; display:inline-block; width:1.1em; transition:transform .15s; }
  .ws-archive[open] > summary::before { transform:rotate(90deg); }
  .ws-archive-count { font-weight:400; color:#94a3b8; }
  .ws-archive-list  { padding:0 12px 1px; }
  .ws-notice-links { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ws-link { display:inline-block; padding:7px 12px; border-radius:10px; background:#4f46e5;
             color:#fff; font-size:12.5px; font-weight:700; text-decoration:none; }
</style>
</head>
<body class="min-h-screen">

  <div class="max-w-3xl mx-auto px-4 py-6 pb-16">

    <header class="mb-6">
      <div class="text-xs font-bold tracking-[0.16em] text-indigo-500">WORKSHEETS</div>
      <h1 class="mt-1.5 text-xl md:text-2xl font-bold text-slate-800">학습지 내려받기</h1>
      <p class="mt-1.5 text-sm text-slate-500 leading-relaxed">
        수업에서 쓴 학습지를 PDF로 받을 수 있습니다.<br class="hidden sm:block">
        휴대폰에서는 <b>내려받기</b>를 누르면 저장되고, <b>바로 보기</b>를 누르면 화면에서 바로 열립니다.
      </p>
    </header>

    <!-- 선생님이 직접 쓰는 공지. 내용은 notices.txt 에서 읽어 온다. -->
    <section id="notices" class="ws-notice" hidden>
      <h2 class="ws-notice-head">📢 공지사항</h2>
      <ul id="noticeList" class="ws-notice-list"></ul>
    </section>

    <!-- 학습지를 올리거나 고치면 자동으로 쌓이는 기록. 손으로 적지 않는다. -->
    <section id="changes" class="ws-notice ws-changes" hidden>
      <h2 class="ws-notice-head">🔄 학습지 변경사항</h2>
      <ul id="changeList" class="ws-notice-list"></ul>
    </section>

    <div id="list" class="flex flex-col gap-3"></div>

    <p id="empty" hidden class="text-center text-sm text-slate-400 py-16">
      아직 올라온 학습지가 없습니다.
    </p>

    <!-- 지난 시험 범위 학습지. 눌러야 펼쳐진다. -->
    <div id="archive"></div>

    <footer class="mt-10 pt-4 border-t border-slate-200 text-xs text-slate-400 leading-relaxed">
      파일이 열리지 않으면 학교 와이파이 대신 데이터로 다시 시도해 보세요.<br>
      PDF 뷰어가 없는 기기에서는 내려받은 뒤 파일 앱에서 열어야 할 수 있습니다.
    </footer>
  </div>

<script>
  // 직접 알릴 공지는 notices.txt 에 적는다. 이 파일을 코드와 떼어 둔 이유는,
  // 배열 안에서 쉼표나 따옴표가 하나 어긋나면 페이지 전체가 멈추기 때문이다.
  // 텍스트 파일은 한 줄이 잘못돼도 그 줄만 건너뛴다.
  // 학습지 업로드·수정 소식은 worksheets-data.js 의 목록에서 자동으로 만들어진다.
  let notices = [];

  // 올린 지 이 기간 안이면 목록에 NEW 표시가 붙는다.
  // 주 단위 수업에 맞춰 7일로 둔다. 너무 길면 전부 NEW 가 되어 표시가 의미를 잃는다.
  const NEW_DAYS = 7;

  // 학습지 목록과 지금 시험 범위는 worksheets-data.js 에 있다 (자료를 올릴 때 고치는 곳).
  // 그 파일이 읽히면 아래 두 값이 채워진다. 떼어 둔 까닭은 loadWorksheets() 설명 참고.
  var CURRENT_EXAM = '';
  var worksheets = [];

  function isCurrent(w) {
    return !w.exam || w.exam === CURRENT_EXAM;
  }

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const archiveEl = document.getElementById('archive');

  // 'YYYY-MM-DD' 를 그 날 자정으로 읽는다. 문자열을 그대로 Date 에 넘기면
  // UTC 로 해석되어 한국 시간 기준 하루가 어긋나므로 숫자로 나눠서 만든다.
  function parseDay(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    // 2026-13-99 처럼 없는 날짜를 넘기면 Date 가 조용히 다음 달로 넘겨 버린다.
    // 만든 날짜를 다시 읽어 값이 달라지면 잘못 적은 것으로 본다.
    if (d.getFullYear() !== +m[1] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[3]) return null;
    return d;
  }

  function daysSince(iso) {
    const d = parseDay(iso);
    if (!d) return Infinity;
    const today = new Date();
    const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    return (midnight - d) / 86400000;
  }

  function isNew(w) {
    const gap = daysSince(w.added);
    return gap >= 0 && gap < NEW_DAYS;
  }

  // 고쳐 올린 날짜 목록. 적은 순서가 뒤바뀌어도 되도록 날짜순으로 세운다.
  function updateDays(w) {
    return (w.updates || []).filter(d => parseDay(d)).sort();
  }
  function lastUpdate(w) {
    const days = updateDays(w);
    return days.length ? days[days.length - 1] : null;
  }

  function isRevised(w) {
    const gap = daysSince(lastUpdate(w));
    return gap >= 0 && gap < NEW_DAYS;
  }

  // 고쳐 올린 자료는 주소 뒤에 수정 날짜를 붙인다.
  // 파일 이름이 그대로면 브라우저가 캐시해 둔 옛 파일을 계속 줄 수 있다.
  function fileHref(w) {
    const last = lastUpdate(w);
    return last ? `${w.file}?v=${last}` : w.file;
  }

  function formatDay(iso) {
    const d = parseDay(iso);
    return d ? `${d.getMonth() + 1}월 ${d.getDate()}일` : String(iso || '');
  }

  // 제목 끝 글자의 받침에 따라 목적격 조사를 고른다 ('방법을', '생명체를').
  function objectParticle(word) {
    const ch = String(word || '').trim().slice(-1);
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      return (code - 0xAC00) % 28 === 0 ? '를' : '을';
    }
    return '를';
  }

  // 주소는 http(s) 만 받는다. javascript: 같은 주소가 섞여도 링크로 만들지 않는다.
  function safeUrl(raw) {
    try {
      const u = new URL(String(raw || '').trim());
      return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
    } catch (e) {
      return null;
    }
  }

  function linkButton(label, url, className) {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = className;
    a.textContent = label;
    return a;
  }

  // notices.txt 한 줄씩 읽기.
  //   '# ...'        주석, 건너뛴다
  //   '날짜 | 내용'   공지 한 건
  //   '- 내용'        바로 위 공지의 세부 항목
  //   '- 이름 | 주소'  바로 위 공지에 붙는 링크 버튼
  // 형식이 어긋난 줄은 조용히 건너뛴다. 한 줄 때문에 공지 전체가 사라지면 안 된다.
  function parseNotices(text) {
    const out = [];
    String(text || '').split(/\r?\n/).forEach(raw => {
      const line = raw.trim();
      if (!line || line.startsWith('#')) return;

      if (line.startsWith('-')) {
        const detail = line.slice(1).trim();
        if (detail && out.length) {
          const last = out[out.length - 1];
          const link = /^(.+?)\s*\|\s*(\S+)$/.exec(detail);
          const url = link && safeUrl(link[2]);
          if (url) (last.links = last.links || []).push({ label: link[1].trim(), url });
          else (last.details = last.details || []).push(detail);
        }
        return;
      }

      const m = /^(\d{4}-\d{2}-\d{2})\s*\|\s*(.+)$/.exec(line);
      if (m && parseDay(m[1])) out.push({ date: m[1], text: m[2].trim(), details: [] });
    });
    return out;
  }

  // 최근 것부터, 많아야 다섯 건까지만 보여 준다.
  function recent(list) {
    return list
      .filter(n => n.date && n.text && parseDay(n.date))
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
      .slice(0, 5);
  }

  // 학습지를 올리거나 고치면 저절로 쌓이는 기록. 손으로 적지 않는다.
  function buildChangeFeed() {
    // 지난 시험 범위의 소식은 접어 둔 학습지와 함께 물러난다.
    const uploads = worksheets
      .filter(w => isCurrent(w) && w.added)
      .map(w => ({
        date: w.added,
        text: `새 학습지 「${w.title}」${objectParticle(w.title)} 올렸습니다.`
      }));

    const revisions = [];
    worksheets.filter(isCurrent).forEach(w => {
      updateDays(w).forEach((day, i) => {
        revisions.push({
          date: day,
          text: `${w.no}번 「${w.title}」 ${i + 1}차 수정본을 올렸습니다. 다시 내려받아 주세요.`
        });
      });
    });

    return recent(uploads.concat(revisions));
  }

  function noticeItem(n) {
    const li = document.createElement('li');
    li.className = 'ws-notice-item';

    const when = document.createElement('span');
    when.className = 'ws-notice-date';
    when.textContent = formatDay(n.date);

    const body = document.createElement('div');
    body.className = 'ws-notice-body';
    body.textContent = n.text;

    if (n.details && n.details.length) {
      const sub = document.createElement('ul');
      sub.className = 'ws-notice-sub';
      n.details.forEach(d => {
        const item = document.createElement('li');
        item.textContent = d;
        sub.appendChild(item);
      });
      body.appendChild(sub);
    }

    if (n.links && n.links.length) {
      const row = document.createElement('div');
      row.className = 'ws-notice-links';
      n.links.forEach(l => row.appendChild(linkButton(l.label, l.url, 'ws-link')));
      body.appendChild(row);
    }

    li.append(when, body);
    return li;
  }

  // 목록이 비면 그 칸만 접는다. 두 칸은 서로 상관없이 뜨고 진다.
  function renderFeed(boxId, listId, feed) {
    const box = document.getElementById(boxId);
    const list = document.getElementById(listId);
    if (!box || !list) return;

    list.textContent = '';
    // Tailwind 가 막혀도 확실히 숨겨지도록 클래스가 아니라 hidden 속성을 쓴다.
    box.hidden = feed.length === 0;
    feed.forEach(n => list.appendChild(noticeItem(n)));
  }

  function renderNotices() {
    renderFeed('notices', 'noticeList', recent(notices));
    renderFeed('changes', 'changeList', buildChangeFeed());
  }

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return Math.round(bytes / 1024) + ' KB';
  }

  // 목록은 우리가 직접 쓰는 값이지만, 렌더링 방식은 리더보드와 같은 규칙을 따른다.
  // 문자열을 이어 붙여 innerHTML 로 넣지 않고 textContent 로만 넣는다.
  function buildCard(w) {
    const card = document.createElement('div');
    card.className = "ws-card sm:p-5 shadow-sm";

    const top = document.createElement('div');
    top.className = "flex items-start gap-3";

    const icon = document.createElement('div');
    icon.className = "shrink-0 w-11 h-11 rounded-xl bg-indigo-50 border border-indigo-100 "
                   + "flex items-center justify-center text-xl";
    icon.textContent = '📄';

    const meta = document.createElement('div');
    meta.className = "flex-1 min-w-0";

    const unit = document.createElement('div');
    unit.className = "text-[11px] font-bold text-indigo-500 tracking-wide";
    unit.textContent = w.unit;

    const title = document.createElement('h2');
    title.className = "text-base font-bold text-slate-800 break-keep leading-snug mt-0.5";
    title.textContent = `${w.no}. ${w.title}`;
    if (isRevised(w) || isNew(w)) {
      const badge = document.createElement('span');
      const revised = isRevised(w);
      badge.className = revised ? 'ws-new ws-revised' : 'ws-new';
      badge.textContent = revised ? `${updateDays(w).length}차 수정` : 'NEW';
      title.appendChild(badge);
    }

    const sub = document.createElement('div');
    sub.className = "text-xs text-slate-500 mt-1";
    sub.textContent = [w.note, `${w.pages}쪽`, formatSize(w.bytes)]
                        .filter(Boolean).join('  ·  ');

    meta.append(unit, title, sub);
    top.append(icon, meta);

    const actions = document.createElement('div');
    actions.className = "ws-btns";

    const dl = document.createElement('a');
    dl.href = fileHref(w);
    dl.setAttribute('download', w.saveAs || '');
    dl.className = "ws-btn ws-btn-dl active:scale-95 transition-transform";
    dl.textContent = '내려받기';

    const view = document.createElement('a');
    view.href = fileHref(w);
    view.target = '_blank';
    view.rel = 'noopener';
    view.className = "ws-btn ws-btn-vw active:scale-95 transition-transform";
    view.textContent = '바로 보기';

    actions.append(dl, view);
    card.append(top, actions);

    const videos = (w.videos || [])
      .map(v => ({ label: String(v.label || '').trim(), url: safeUrl(v.url) }))
      .filter(v => v.label && v.url);
    if (videos.length) {
      const row = document.createElement('div');
      row.className = 'ws-btns ws-btns-video';
      videos.forEach(v => row.appendChild(
        linkButton(`▶ ${v.label}`, v.url, 'ws-btn ws-btn-video active:scale-95 transition-transform')));
      card.append(row);
    }
    return card;
  }

  // 목록을 처음부터 다시 그린다. 새로 받아 올 때마다 부른다.
  // 학생이 펼쳐 둔 '지난 학습지' 칸은 다시 그려도 펼친 채로 둔다.
  function renderList(loaded) {
    const opened = new Set(
      [...archiveEl.querySelectorAll('details[open]')].map(d => d.dataset.exam));
    listEl.textContent = '';
    archiveEl.textContent = '';

    // 배열에 적은 순서와 무관하게 번호 순으로 보여 준다.
    const byNo = (a, b) => a.no - b.no;
    const current = worksheets.filter(isCurrent).sort(byNo);
    current.forEach(w => listEl.appendChild(buildCard(w)));

    emptyEl.textContent = (!loaded && worksheets.length === 0)
      ? '학습지 목록을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'
      : '아직 올라온 학습지가 없습니다.';
    emptyEl.hidden = current.length > 0;

    // 지난 시험 범위는 시험별로 하나씩 접어 맨 아래에 둔다. 최근에 올린 범위가 위.
    const pastGroups = [];
    worksheets.filter(w => !isCurrent(w)).forEach(w => {
      let g = pastGroups.find(x => x.exam === w.exam);
      if (!g) pastGroups.push(g = { exam: w.exam, items: [], latest: '' });
      g.items.push(w);
      if ((w.added || '') > g.latest) g.latest = w.added || '';
    });
    pastGroups
      .sort((a, b) => (a.latest < b.latest ? 1 : a.latest > b.latest ? -1 : 0))
      .forEach(g => {
        const box = document.createElement('details');
        box.className = 'ws-archive';
        box.dataset.exam = g.exam;
        box.open = opened.has(g.exam);

        const head = document.createElement('summary');
        head.textContent = `지난 학습지 — ${g.exam} `;
        const count = document.createElement('span');
        count.className = 'ws-archive-count';
        count.textContent = `(${g.items.length}개)`;
        head.appendChild(count);

        const inner = document.createElement('div');
        inner.className = 'ws-archive-list';
        g.items.sort(byNo).forEach(w => inner.appendChild(buildCard(w)));

        box.append(head, inner);
        archiveEl.appendChild(box);
      });
  }

  // GitHub Pages 는 모든 파일을 10분씩 캐시하라고 알려 주고, 휴대폰은 열어 둔 탭을
  // 새로 읽지 않고 그대로 되살린다. 그래서 목록이 이 페이지 안에 있으면 새 학습지가
  // 한참 안 뜬다. 목록 파일 주소 뒤에 매번 다른 값(?t=시각)을 붙여 어느 캐시도 거치지
  // 않고 늘 새 파일을 받는다. 몇 KB 라 매번 받아도 부담이 없다.
  function loadWorksheets() {
    return new Promise(resolve => {
      const s = document.createElement('script');
      s.src = 'worksheets-data.js?t=' + Date.now();
      s.onload = () => { s.remove(); resolve(true); };
      s.onerror = () => { s.remove(); resolve(false); };
      document.head.appendChild(s);
    });
  }

  function loadNotices() {
    return fetch('notices.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(res => (res.ok ? res.text() : null))
      .then(text => {
        // 공지를 모두 숨겼을 때도 화면에서 사라지도록, 읽어 왔으면 비어 있어도 바꾼다.
        if (text !== null) notices = parseNotices(text);
      })
      .catch(() => { /* 공지 파일을 못 읽어도 학습지 목록은 그대로 쓴다 */ });
  }

  let lastRefresh = 0;
  function refresh() {
    lastRefresh = Date.now();
    loadWorksheets().then(loaded => {
      renderList(loaded);
      renderNotices();          // 변경사항 칸도 목록에서 만들어진다
    });
    loadNotices().then(renderNotices);
  }

  refresh();

  // 다른 앱이나 탭에 갔다가 돌아오면 다시 받아 온다. 휴대폰이 탭을 붙들고 있던
  // 사이에 올라온 학습지와 공지가 바로 뜬다. 잠깐 왔다 갔다 할 때는 건너뛴다.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 30000) refresh();
  });
  // '뒤로 가기' 로 돌아와 브라우저가 예전 화면을 그대로 꺼내 보일 때도 다시 받아 온다.
  window.addEventListener('pageshow', e => { if (e.persisted) refresh(); });
</script>
</body>
</html>
