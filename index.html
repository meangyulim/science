<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민규 선생님의 과학 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .sim-container { height: calc(100vh - 160px); }
        iframe { border: none; width: 100%; height: 100%; border-radius: 12px; background: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- 상단 헤더 -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                    <span>🔬</span> 민규 선생님의 과학 실험실
                </h1>
                <p class="text-sm text-slate-500">다양한 물리/화학 시뮬레이션을 한곳에서 체험해보세요.</p>
            </div>
            <div id="sim-menu" class="flex flex-wrap gap-2">
                <!-- 버튼들이 자바스크립트로 생성됩니다 -->
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="max-w-7xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
            <div class="bg-slate-800 px-4 py-2 flex items-center gap-2">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <span id="current-title" class="text-xs text-slate-400 font-mono ml-4 uppercase tracking-widest">실험을 선택해주세요</span>
            </div>
            
            <div class="sim-container p-2 bg-slate-100">
                <iframe id="sim-viewer" srcdoc="<div style='display:flex; height:100vh; align-items:center; justify-content:center; font-family:sans-serif; color:#64748b;'>왼쪽 상단에서 실험 버튼을 눌러주세요!</div>"></iframe>
            </div>
        </div>
    </main>

    <footer class="text-center py-8 text-slate-400 text-sm">
        &copy; 2026 민규 선생님의 과학교실. 모든 시뮬레이션은 HTML5로 제작되었습니다.
    </footer>

    <script>
        // 여기에 민규님이 가지고 계신 시뮬레이션 코드들을 넣으세요!
        const simulations = [
            {
                id: 'gravity',
                name: '중력 가속도 실험',
                // 아래 'code' 부분에 가지고 계신 HTML 코드 전체를 백틱( ` ) 안에 넣으시면 됩니다.
                code: `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff; }
                            canvas { border: 1px solid #eee; background: #f9f9f9; cursor: pointer; }
                        </style>
                    </head>
                    <body>
                        <canvas id="c"></canvas>
                        <script>
                            const c = document.getElementById('c');
                            const ctx = c.getContext('2d');
                            c.width = 500; c.height = 400;
                            let y = 50, v = 0, g = 0.5;
                            function draw() {
                                ctx.clearRect(0,0,500,400);
                                ctx.beginPath(); ctx.arc(250, y, 20, 0, Math.PI*2);
                                ctx.fillStyle = '#6366f1'; ctx.fill();
                                v += g; y += v;
                                if(y > 380) { y = 380; v *= -0.8; }
                                requestAnimationFrame(draw);
                            }
                            draw();
                            c.onclick = () => { y = 50; v = 0; };
                        <\/script>
                    </body>
                    </html>
                `
            },
            {
                id: 'molecule',
                name: '분자 운동 (기체)',
                code: `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            body { margin: 0; background: #1e293b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
                            canvas { border: 2px solid #334155; }
                        </style>
                    </head>
                    <body>
                        <h3>기체 분자 운동 시뮬레이션</h3>
                        <canvas id="mc" width="400" height="300"></canvas>
                        <script>
                            const canvas = document.getElementById('mc');
                            const ctx = canvas.getContext('2d');
                            const particles = Array.from({length: 20}, () => ({
                                x: Math.random()*380 + 10, y: Math.random()*280 + 10,
                                vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4
                            }));
                            function loop() {
                                ctx.clearRect(0,0,400,300);
                                particles.forEach(p => {
                                    p.x += p.vx; p.y += p.vy;
                                    if(p.x<5 || p.x>395) p.vx *= -1;
                                    if(p.y<5 || p.y>295) p.vy *= -1;
                                    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                                    ctx.fillStyle = '#f87171'; ctx.fill();
                                });
                                requestAnimationFrame(loop);
                            }
                            loop();
                        <\/script>
                    </body>
                    </html>
                `
            }
            // 새로운 시뮬레이션을 추가하려면 여기에 같은 형식으로 { id, name, code }를 추가하세요.
        ];

        const menuContainer = document.getElementById('sim-menu');
        const viewer = document.getElementById('sim-viewer');
        const titleDisplay = document.getElementById('current-title');

        // 메뉴 버튼 생성
        simulations.forEach(sim => {
            const btn = document.createElement('button');
            btn.className = "px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-600 transition-all shadow-sm";
            btn.innerText = sim.name;
            btn.onclick = () => loadSimulation(sim);
            menuContainer.appendChild(btn);
        });

        function loadSimulation(sim) {
            // iframe에 코드 주입
            viewer.srcdoc = sim.code;
            titleDisplay.innerText = "Current Experiment: " + sim.name;
            
            // 활성화된 버튼 스타일링
            Array.from(menuContainer.children).forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
                if(b.innerText === sim.name) {
                    b.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
                }
            });
        }
    </script>
</body>
</html>
