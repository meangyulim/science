<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>민규 선생님의 과학 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        html, body { 
            font-family: 'Noto Sans KR', sans-serif; 
            overflow: hidden; /* 전체 페이지 스크롤 방지 */
            position: fixed; 
            width: 100%; 
            height: 100%;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            background-color: #f8fafc; /* 연한 배경색 */
        }

        /* 메인 컨테이너 (홈 화면 및 시뮬레이션 화면을 담는 공간) */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            z-index: 50;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        /* 화면 전환 영역 */
        .view-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 홈 뷰 (카드 목록) */
        #home-view {
            position: absolute;
            inset: 0;
            overflow-y: auto; /* 카드 목록이 많으면 내부 스크롤 허용 */
            padding: 16px;
            padding-bottom: 60px; /* 푸터 공간 확보 */
            -webkit-overflow-scrolling: touch;
        }

        /* 시뮬레이션 뷰 */
        #sim-view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            background-color: #ffffff;
            overflow-y: auto; 
    -webkit-overflow-scrolling: touch;
        }

        /* 시뮬레이션 내부 헤더 (뒤로가기 등) */
        .sim-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            gap: 12px;
        }

        iframe { 
            border: none; 
            flex: 1;
            width: 100%; 
            height: 100%; 
            display: block;
        }

        /* 하단 푸터 (방문자 카운터) */
        footer {
            height: 40px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 50;
        }

        /* 스크롤바 숨기기 (선택사항) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <header id="main-header">
            <div class="flex items-center cursor-pointer" onclick="goHome()">
                <span class="text-xl mr-2">🔬</span>
                <h1 class="text-base font-bold text-indigo-600">민규쌤의 과학 실험실</h1>
            </div>
            <div></div>
        </header>

        <div class="view-area">
            <main id="home-view" class="no-scrollbar">
                <div class="max-w-5xl mx-auto">
                    <div class="mb-6 mt-4 px-2">
                        <h2 class="text-lg md:text-xl font-bold text-slate-800">원하는 실험을 선택해보세요!</h2>
                        <p class="text-sm text-slate-500 mt-1">카드를 터치하면 시뮬레이션이 시작됩니다.</p>
                    </div>

                    <div id="card-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        </div>
                </div>
            </main>

            <main id="sim-view">
                <div class="sim-header shadow-sm">
                    <button onclick="goHome()" class="flex items-center px-3 py-1.5 bg-white text-slate-700 text-sm font-semibold rounded shadow-sm border border-slate-200 active:bg-slate-50 active:scale-95 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        목록으로
                    </button>
                    <h3 id="current-sim-title" class="font-bold text-slate-800 text-sm truncate flex-1 text-center pr-10">
                        시뮬레이션 제목
                    </h3>
                </div>
                <iframe id="sim-viewer" src="about:blank" allow="autoplay; fullscreen" scrolling="auto"></iframe>
            </main>
        </div>

        <footer id="main-footer">
            <div class="flex items-center text-slate-500 gap-2">
                <img src="https://api.visitorbadge.io/api/visitors?path=mingyu-science.github.io&label=방문자수&labelColor=%231e293b&countColor=%234f46e5&style=flat" alt="방문자 카운터">
            </div>
        </footer>
    </div>

    <script>
        // 시뮬레이션 목록: 카드 디자인을 위해 아이콘과 배경색상 클래스(Tailwind) 추가
        const simulations = [
            { 
                id: 'geologic-time-game', 
                name: '지질시대 온라인 게임', 
                url: 'test/index.html', // ★ 이 부분이 text 폴더 안의 index.html 경로로 변경되었습니다.
                icon: '🏜️',
                color: 'bg-yellow-100 text-yellow-700 border-yellow-200'
            },
            { 
                id: 'sedimentary-structures', 
                name: '퇴적구조의 수직단면 층리면', 
                url: 'sedimentary-structures.html',
                icon: '🏜️',
                color: 'bg-orange-100 text-orange-700 border-orange-200'
            },
            { 
                id: 'cyclone', 
                name: '중위도 저기압', 
                url: 'cyclone.html',
                icon: '🌪️',
                color: 'bg-blue-100 text-blue-700 border-blue-200'
            },
            { 
                id: 'overturned-cross-bedding', 
                name: '사층리 역전', 
                url: 'Overturned cross bedding.html',
                icon: '🔄',
                color: 'bg-emerald-100 text-emerald-700 border-emerald-200'
            },
            { 
                id: 'land', 
                name: '지사학 법칙', 
                url: 'land.html',
                icon: '⛰️',
                color: 'bg-purple-100 text-purple-700 border-purple-200'
            },
            { 
                id: 'wind', 
                name: '중위도 저기압 풍향 변화', 
                url: 'wind.html',
                icon: '🎏',
                color: 'bg-violet-100 text-violet-700 border-violet-200'
            },
            { 
                id: 'windspin', 
                name: '상승기류 하강기류 회전 방향', 
                url: 'windspin.html',
                icon: '🔄',
                color: 'bg-lime-100 text-lime-700 border-lime-200'},
            { 
                id: 'el', 
                name: '엘니뇨 라니냐 수직단면 및 비교표', 
                url: 'el.html',
                icon: '🌊',
                color: 'bg-blue-100 text-blue-700 border-blue-200'},
            { 
                id: 'sand', 
                name: '삼각함수 샌드위치', 
                url: 'sand.html',
                icon: '🥪',
                color: 'bg-orange-100 text-orange-700 border-orange-200'},
            { 
                id: 'spaceboom', 
                name: '대폭발 우주론과 급팽창 우주론', 
                url: 'spaceboom.html',
                icon: '🌌',
                color: 'bg-black-100 text-black-700 border-black-200'},
            { 
                id: 'eccentricity', 
                name: '이심률에 따른 궤도 형태', 
                url: 'eccentricity.html',
                icon: '🪐',
                color: 'bg-indigo-100 text-indigo-700 border-indigo-200'},
            { 
                id: 'haidilao-preorder', 
                name: '하이디라오 주문 시뮬레이터', 
                url: 'hdl_simulation.html',
                icon: '🍲',
                color: 'bg-red-100 text-red-700 border-red-200'}
        ];

        const homeView = document.getElementById('home-view');
        const simView = document.getElementById('sim-view');
        const cardContainer = document.getElementById('card-container');
        const viewer = document.getElementById('sim-viewer');
        const currentSimTitle = document.getElementById('current-sim-title');
        
        // 새로 추가됨: 숨김/표시 제어를 위한 헤더와 푸터 요소 가져오기
        const mainHeader = document.getElementById('main-header');
        const mainFooter = document.getElementById('main-footer');

        // 홈 화면에 카드 동적 생성
        simulations.forEach(sim => {
            const card = document.createElement('div');
            card.className = `flex flex-col items-center justify-center p-6 rounded-2xl border-2 cursor-pointer transition-all hover:-translate-y-1 hover:shadow-lg active:scale-95 ${sim.color} bg-opacity-50 hover:bg-opacity-100`;
            card.innerHTML = `
                <div class="text-4xl mb-3">${sim.icon}</div>
                <h3 class="text-base font-bold text-center break-keep">${sim.name}</h3>
                <div class="mt-4 px-4 py-1.5 bg-white bg-opacity-70 rounded-full text-xs font-semibold shadow-sm">
                    실행하기 ▶
                </div>
            `;
            
            // 카드 클릭 이벤트
            card.onclick = () => openSimulation(sim);
            cardContainer.appendChild(card);
        });

        // --- 화면 전환 (실제 렌더링) ---
        const HOME_TITLE = document.title;
        let currentUrl = 'about:blank';

        // iframe 의 src 속성을 직접 바꾸면 브라우저 세션 히스토리에 항목이 하나 더 쌓인다.
        // 그러면 뒤로가기가 '목록'이 아니라 'iframe 의 이전 문서'로 가버리므로,
        // 히스토리에 남지 않는 location.replace 로 이동시킨다.
        function setViewerUrl(url) {
            if (currentUrl === url) return;
            currentUrl = url;
            try {
                viewer.contentWindow.location.replace(url);
            } catch (e) {
                viewer.src = url; // 접근이 막히는 환경에서는 원래 방식으로 대체
            }
        }

        function showSim(sim) {
            currentSimTitle.innerText = sim.name;
            setViewerUrl(sim.url);
            document.title = `${sim.name} · ${HOME_TITLE}`;

            // 뷰 전환 (홈 숨기고, 시뮬레이션 보이기)
            homeView.style.display = 'none';
            // 시뮬레이션 진입 시 헤더와 푸터 숨기기
            mainHeader.style.display = 'none'; 
            mainFooter.style.display = 'none'; 
            simView.style.display = 'flex';
        }

        function showHome() {
            setViewerUrl('about:blank'); // 메모리 확보를 위해 iframe 비우기
            document.title = HOME_TITLE;

            // 뷰 전환 (시뮬레이션 숨기고, 홈 보이기)
            simView.style.display = 'none';
            homeView.style.display = 'block';
            // 홈 화면으로 돌아올 때 헤더와 푸터 다시 보이기
            mainHeader.style.display = 'flex'; 
            mainFooter.style.display = 'flex'; 
        }

        // --- 해시 라우팅 ---
        // 주소창의 #아이디가 곧 현재 화면이다. 덕분에
        //  (1) 휴대폰 뒤로가기가 사이트를 벗어나지 않고 목록으로 돌아오고
        //  (2) 특정 시뮬레이션 링크를 그대로 공유할 수 있다.

        // 목록에서 직접 들어온 경우에만 history.back()으로 되돌릴 수 있다.
        // (링크를 타고 시뮬레이션으로 바로 진입했다면 이전 항목은 우리 페이지가 아니다)
        let pushedByUs = false;

        function applyRoute() {
            const id = decodeURIComponent(location.hash.replace(/^#/, ''));
            const sim = simulations.find(s => s.id === id);
            if (sim) {
                showSim(sim);
            } else {
                pushedByUs = false;
                showHome();
            }
        }

        // 시뮬레이션 열기 함수 (해시만 바꾸고 실제 전환은 applyRoute가 담당)
        function openSimulation(sim) {
            pushedByUs = true;
            location.hash = encodeURIComponent(sim.id);
        }

        // 홈으로 돌아가기 함수
        function goHome() {
            if (pushedByUs) {
                history.back(); // 뒤로가기 버튼과 동작을 일치시킨다
            } else {
                // 딥링크로 바로 진입한 경우: 뒤로 갈 곳이 우리 페이지가 아니므로
                // 히스토리를 늘리지 않고 주소의 해시만 지운다.
                // location.replace 는 문서를 통째로 다시 불러오므로 쓰지 않는다
                // (replaceState 는 hashchange 를 발생시키지 않아 showHome 을 직접 호출한다).
                history.replaceState(null, '', location.pathname + location.search);
                showHome();
            }
        }

        window.addEventListener('hashchange', applyRoute);
        applyRoute(); // 최초 진입 시 주소의 해시를 반영 (딥링크 포함)

        // iOS 등에서 화면 스크롤 시 빈 공간 스크롤 방지 (iframe 내부는 정상 작동)
        document.addEventListener('touchmove', function(e) {
            // 홈 화면 안에서는 스크롤 허용, 그 외(시뮬레이션 화면의 배경 등)는 스크롤 방지
            if (!e.target.closest('#home-view') && !e.target.closest('#sim-viewer')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
