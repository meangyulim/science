<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민규 선생님의 과학 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .sim-container { height: calc(100vh - 180px); }
        iframe { border: none; width: 100%; height: 100%; border-radius: 12px; background: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                    <span>🔬</span> 민규 선생님의 과학 실험실
                </h1>
                <p class="text-sm text-slate-500">실험 항목을 선택하여 시뮬레이션을 실행하세요.</p>
            </div>
            <div id="sim-menu" class="flex flex-wrap gap-2">
                <!-- 버튼이 자바스크립트로 생성됩니다 -->
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
            <div class="bg-slate-800 px-4 py-2 flex items-center justify-between">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <span id="current-title" class="text-xs text-slate-400 font-mono uppercase tracking-widest">실험 대기 중</span>
                <div class="w-10"></div> 
            </div>
            
            <div class="sim-container p-2 bg-slate-100">
                <iframe id="sim-viewer" src="about:blank"></iframe>
            </div>
        </div>
    </main>

    <script>
        // 시뮬레이션 목록 관리 - 새로운 실험이 생길 때마다 여기에 추가하세요!
        const simulations = [
            { id: 'cyclone', name: '중위도 저기압', url: 'cyclone.html' }
        ];

        const menuContainer = document.getElementById('sim-menu');
        const viewer = document.getElementById('sim-viewer');
        const titleDisplay = document.getElementById('current-title');

        simulations.forEach(sim => {
            const btn = document.createElement('button');
            btn.className = "px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-600 transition-all shadow-sm";
            btn.innerText = sim.name;
            btn.onclick = () => {
                viewer.src = sim.url; 
                titleDisplay.innerText = "Playing: " + sim.name;
                
                // 버튼 활성화 스타일
                Array.from(menuContainer.children).forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
                });
                btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
            };
            menuContainer.appendChild(btn);
        });

        // 페이지 로드 시 첫 번째 실험(중위도 저기압) 자동 실행
        window.onload = () => {
            if(simulations.length > 0) {
                setTimeout(() => {
                    const firstBtn = menuContainer.firstElementChild;
                    if (firstBtn) firstBtn.click();
                }, 500);
            }
        };
    </script>
</body>
</html>
