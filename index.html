<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>민규 선생님의 과학 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        html, body { 
            font-family: 'Noto Sans KR', sans-serif; 
            overflow: hidden; /* 전체 페이지 스크롤 방지 */
            position: fixed; 
            width: 100%; 
            height: 100%;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            background-color: #f8fafc; /* 연한 배경색 */
        }

        /* 메인 컨테이너 (홈 화면 및 시뮬레이션 화면을 담는 공간) */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            z-index: 50;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        /* 화면 전환 영역 */
        .view-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 홈 뷰 (카드 목록) */
        #home-view {
            position: absolute;
            inset: 0;
            overflow-y: auto; /* 카드 목록이 많으면 내부 스크롤 허용 */
            padding: 16px;
            padding-bottom: 60px; /* 푸터 공간 확보 */
            -webkit-overflow-scrolling: touch;
        }

        /* 시뮬레이션 뷰 */
        #sim-view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            background-color: #ffffff;
            overflow-y: auto; 
    -webkit-overflow-scrolling: touch;
        }

        /* 시뮬레이션 내부 헤더 (뒤로가기 등) */
        .sim-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            gap: 12px;
        }

        iframe { 
            border: none; 
            flex: 1;
            width: 100%; 
            height: 100%; 
            display: block;
        }

        /* 하단 푸터 (방문자 카운터) */
        footer {
            height: 40px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 50;
        }

        /* --- 첫 화면 목록 ---
           학교망에서 Tailwind CDN 이 막혀도 목록은 고를 수 있도록
           첫 화면 모양은 Tailwind 클래스가 아니라 아래 규칙으로 직접 잡는다. */
        .brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .brand-icon { font-size: 20px; line-height: 1; }
        .brand h1 { margin: 0; font-size: 16px; font-weight: 700; color: #4f46e5; }
        .brand-count { font-size: 12px; color: #94a3b8; }

        .home-wrap { max-width: 1024px; margin: 0 auto; }

        .ws-banner {
            display: flex; align-items: center; gap: 12px;
            margin: 4px 0 16px; padding: 12px 16px;
            background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 16px;
            color: #3730a3; text-decoration: none;
        }
        .ws-banner:active { transform: scale(.99); }
        .ws-banner-icon { font-size: 24px; line-height: 1; }
        .ws-banner-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .ws-banner-text b { font-size: 15px; }
        .ws-banner-text span { font-size: 12px; color: #6366f1; }
        .ws-banner-go { font-size: 13px; font-weight: 700; white-space: nowrap; }

        /* 검색창과 분류 탭은 목록을 내려도 위에 붙어 있다 */
        .toolbar {
            position: sticky; top: -16px; z-index: 5;
            margin: 0 -16px; padding: 12px 16px 10px;
            background: rgba(248, 250, 252, .94);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .search { position: relative; }
        .search svg {
            position: absolute; left: 12px; top: 50%; width: 18px; height: 18px;
            transform: translateY(-50%); color: #94a3b8; pointer-events: none;
        }
        .search input {
            width: 100%; box-sizing: border-box; height: 42px; padding: 0 12px 0 38px;
            border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
            font: inherit; font-size: 16px; /* 16px 미만이면 iOS 가 화면을 확대한다 */
            color: #1e293b; outline: none;
        }
        .search input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px #e0e7ff; }
        .chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
        .chip {
            flex: none; padding: 7px 13px; border-radius: 999px;
            border: 1px solid #e2e8f0; background: #fff; color: #475569;
            font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .chip small { font-weight: 400; color: #94a3b8; margin-left: 3px; }
        .chip[aria-selected="true"] { background: #4f46e5; border-color: #4f46e5; color: #fff; }
        .chip[aria-selected="true"] small { color: #c7d2fe; }

        .section { margin-top: 14px; }
        .section-head {
            display: flex; align-items: baseline; gap: 6px;
            margin: 0 4px 8px; font-size: 14px; font-weight: 700; color: #334155;
        }
        .section-head small { font-weight: 400; color: #94a3b8; font-size: 12px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
            cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%;
            transition: box-shadow .15s, transform .15s, border-color .15s;
        }
        .card:hover { border-color: #cbd5e1; box-shadow: 0 4px 12px rgba(15, 23, 42, .06); }
        .card:active { transform: scale(.98); }
        .card:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
        .card-icon {
            flex: none; width: 44px; height: 44px; border-radius: 12px;
            display: grid; place-items: center; font-size: 24px; line-height: 1;
        }
        .card-text { flex: 1; min-width: 0; }
        .card-name {
            display: block; font-size: 14.5px; font-weight: 700; color: #1e293b;
            line-height: 1.35; word-break: keep-all;
        }
        .card-desc {
            display: block; margin-top: 2px; font-size: 12.5px; color: #64748b;
            line-height: 1.4; word-break: keep-all;
        }
        .card-arrow { flex: none; color: #cbd5e1; font-size: 18px; }
        .badge {
            display: inline-block; margin-left: 5px; padding: 1px 6px; border-radius: 999px;
            font-size: 10px; font-weight: 700; vertical-align: 2px; letter-spacing: .02em;
        }
        .badge-new { background: #4f46e5; color: #fff; }
        .badge-phone { background: #fef3c7; color: #92400e; }
        .badge-tag { background: #e0e7ff; color: #3730a3; }

        /* 지금 수업 묶음은 바탕을 깔아 눈에 띄게 */
        .section-class {
            margin: 14px -4px 0; padding: 12px 4px 4px;
            background: #eef2ff; border-radius: 18px;
        }
        .section-class .section-head { color: #3730a3; margin-left: 8px; }
        .section-class .section-head small { color: #6366f1; }
        .section-class .grid { padding: 0 4px 4px; }

        /* 분류마다 아이콘 바탕색 */
        .cat-activity .card-icon { background: #dcfce7; }
        .cat-geo   .card-icon { background: #fef3c7; }
        .cat-air   .card-icon { background: #e0f2fe; }
        .cat-space .card-icon { background: #ede9fe; }
        .cat-etc   .card-icon { background: #f1f5f9; }

        .empty { margin: 32px 0; text-align: center; font-size: 14px; color: #94a3b8; }

        /* 스크롤바 숨기기 (선택사항) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <header id="main-header">
            <div class="brand" onclick="goHome()">
                <span class="brand-icon">🔬</span>
                <h1>민규쌤의 과학 실험실</h1>
            </div>
            <span class="brand-count" id="sim-count"></span>
        </header>

        <div class="view-area">
            <main id="home-view" class="no-scrollbar">
                <div class="home-wrap">
                    <a class="ws-banner" href="#worksheets">
                        <span class="ws-banner-icon">📄</span>
                        <span class="ws-banner-text">
                            <b>학습지 내려받기</b>
                            <span>수업 학습지 PDF와 공지</span>
                        </span>
                        <span class="ws-banner-go">열기 ›</span>
                    </a>

                    <div class="toolbar">
                        <div class="search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
                            <input id="search" type="search" placeholder="실험 이름으로 찾기" autocomplete="off" aria-label="실험 찾기">
                        </div>
                        <div id="chips" class="chips no-scrollbar" role="tablist" aria-label="분류"></div>
                    </div>

                    <div id="card-container"></div>
                    <p id="empty" class="empty" hidden>찾는 실험이 없어요. 다른 낱말로 찾아보세요.</p>
                </div>
            </main>

            <main id="sim-view">
                <div class="sim-header shadow-sm">
                    <button onclick="goHome()" class="flex items-center px-3 py-1.5 bg-white text-slate-700 text-sm font-semibold rounded shadow-sm border border-slate-200 active:bg-slate-50 active:scale-95 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        목록으로
                    </button>
                    <h3 id="current-sim-title" class="font-bold text-slate-800 text-sm truncate flex-1 text-center pr-10">
                        시뮬레이션 제목
                    </h3>
                </div>
                <iframe id="sim-viewer" src="about:blank" allow="autoplay; fullscreen; geolocation; screen-wake-lock; camera; accelerometer; gyroscope; magnetometer" scrolling="auto"></iframe>
            </main>
        </div>

        <footer id="main-footer">
            <div class="flex items-center text-slate-500 gap-2">
                <img src="https://api.visitorbadge.io/api/visitors?path=mingyu-science.github.io&label=방문자수&labelColor=%231e293b&countColor=%234f46e5&style=flat" alt="방문자 카운터">
            </div>
        </footer>
    </div>

    <script>
        // 학습지는 카드 목록과 따로 맨 위 띠로 보여 준다.
        // 주소는 예전처럼 #worksheets 로 열린다.
        const pinnedItem = {
            id: 'worksheets',
            name: '학습지 내려받기',
            url: 'worksheets/'
        };

        // 지금 수업 — '전체' 화면 맨 위에 따로 묶어 보여 준다.
        // 진도가 넘어가면 이 블록만 바꾸면 된다.
        //   items 에는 아래 simulations 의 id 를 적는다.
        //   { id, tag } 처럼 쓰면 카드에 작은 표시(예: 학습지 번호)가 붙는다.
        //   url 까지 적으면 목록에 없는 바로가기 카드가 된다 (시뮬레이션 안의 특정 화면 등).
        const currentClass = {
            title: '지금 수업 · 행성우주과학 기말',
            note: 'Ⅱ. 태양과 별의 관측',
            items: [
                { id: 'sand', tag: '기말 2번' },
                { id: 'variable-stars', tag: '기말 4번' },
                {
                    id: 'variable-stars-pulse',
                    name: '맥동 변광성 · 맥동의 원리',
                    desc: '반지름·표면 온도가 바뀌며 밝기가 변하는 원리',
                    url: 'sims/variables/#pulse',
                    icon: '💓',
                    category: 'space',
                    tag: '기말 4번'
                }
            ]
        };

        // 분류 — 탭과 목록의 묶음이 이 순서로 나온다.
        const categories = [
            { id: 'activity', name: '활동 수업', icon: '🏃' },
            { id: 'geo',   name: '지질·고체지구', icon: '⛰️' },
            { id: 'air',   name: '대기·해양',     icon: '🌦️' },
            { id: 'space', name: '천체·우주',     icon: '🪐' },
            { id: 'etc',   name: '그 밖의 것',    icon: '🧩' }
        ];

        // 시뮬레이션 목록 — 만들어진 순서(오래된 것 → 최근 것)로 둔다.
        // 새로 만든 시뮬레이션은 이 배열 맨 아래에 추가하면 된다.
        //   category: 위 categories 의 id
        //   desc:     카드에 작게 나오는 한 줄 설명
        //   phone:    true 면 '폰으로' 표시 (카메라·센서·야외 활동)
        // 맨 아래 NEW_COUNT 개는 자동으로 NEW 표시가 붙는다.
        const simulations = [
            {
                id: 'geologic-time-game',
                name: '지질시대 온라인 게임',
                desc: '화석·기후·대멸종을 익히고 친구와 실력 대결',
                url: 'sims/geologic-game/',
                icon: '🏜️',
                category: 'geo'
            },
            {
                id: 'sedimentary-structures',
                name: '퇴적구조의 수직단면 층리면',
                desc: '사층리·점이층리·연흔·건열을 단면과 층리면으로',
                url: 'sims/sedimentary-structures.html',
                icon: '🏜️',
                category: 'geo'
            },
            {
                id: 'cyclone',
                name: '중위도 저기압',
                desc: '정체 전선에서 전선이 갈라지기까지 3D로',
                url: 'sims/cyclone.html',
                icon: '🌪️',
                category: 'air'
            },
            {
                id: 'overturned-cross-bedding',
                name: '사층리 역전',
                desc: '사층리로 지층 역전과 옛 흐름 방향 읽기',
                url: 'sims/overturned-cross-bedding.html',
                icon: '🔄',
                category: 'geo'
            },
            {
                id: 'land',
                name: '지사학 법칙',
                desc: '누중·부정합·관입·동물군 천이를 3D 지층으로',
                url: 'sims/land.html',
                icon: '⛰️',
                category: 'geo'
            },
            {
                id: 'wind',
                name: '중위도 저기압 풍향 변화',
                desc: '저기압이 지나갈 때 관측소 A·B의 풍향 변화',
                url: 'sims/wind.html',
                icon: '🎏',
                category: 'air'
            },
            {
                id: 'windspin',
                name: '상승기류 하강기류 회전 방향',
                desc: '고기압·저기압 바람이 도는 방향, 북반구·남반구',
                url: 'sims/windspin.html',
                icon: '🔄',
                category: 'air'
            },
            {
                id: 'el',
                name: '엘니뇨 라니냐 수직단면 및 비교표',
                desc: '무역풍에 따라 바뀌는 워커 순환과 바다 단면',
                url: 'sims/el.html',
                icon: '🌊',
                category: 'air'
            },
            {
                id: 'sand',
                name: '삼각함수 샌드위치',
                desc: '작은 각에서 tan θ ≈ θ — 연주시차와 파섹',
                url: 'sims/sand.html',
                icon: '🥪',
                category: 'space'
            },
            {
                id: 'spaceboom',
                name: '대폭발 우주론과 급팽창 우주론',
                desc: '평탄성·지평선·자기 홀극 문제와 급팽창',
                url: 'sims/spaceboom.html',
                icon: '🌌',
                category: 'space'
            },
            {
                id: 'haidilao-preorder',
                name: '하이디라오 주문 시뮬레이터',
                desc: '육수와 메뉴를 골라 주문 내역서 만들기',
                url: 'sims/haidilao/',
                icon: '🍲',
                category: 'etc'
            },
            {
                id: 'eccentricity',
                name: '이심률에 따른 궤도 형태',
                desc: '이심률을 0에서 1 너머까지 바꾸며 궤도 보기',
                url: 'sims/eccentricity.html',
                icon: '🪐',
                category: 'activity'
            },
            {
                id: 'sextant',
                name: '육분의 광학 시뮬레이터',
                desc: '거울 두 장의 빛 경로로 고도를 재는 원리',
                url: 'sims/sextant.html',
                icon: '🔭',
                category: 'space'
            },
            {
                id: 'exoplanets',
                name: '외계행성 탐사 · 별빛에 남은 흔적',
                desc: '시선 속도·식현상·미세 중력 렌즈·직접 관측',
                url: 'sims/exoplanets/',
                icon: '✨',
                category: 'space'
            },
            {
                id: 'variable-stars',
                name: '변광성 실험실 · 광도 곡선으로 읽는 별과 우주',
                desc: '광도 곡선, 세페이드로 거리 재기, Ia형 초신성',
                url: 'sims/variables/',
                icon: '🌟',
                category: 'space'
            },
            {
                id: 'campus-quake',
                name: '야외수업 · 캠퍼스 지진, 진앙을 찾아라',
                desc: '모두의 휴대폰이 관측소 — PS시로 진앙 찾기',
                url: 'sims/quake/',
                icon: '📡',
                category: 'activity',
                phone: true
            },
            {
                id: 'phone-sextant',
                name: '폰 육분의 · 해와 별의 고도로 내 위치 찾기',
                desc: '카메라·기울기 센서로 해·달·별의 고도 재기',
                url: 'sims/phone-sextant/',
                icon: '🧭',
                category: 'activity',
                phone: true
            }
        ];
        const NEW_COUNT = 3;

        // 지금 수업 카드: id 로 시뮬레이션을 찾아 tag 를 덧붙이고, url 이 있으면 바로가기 카드로 쓴다
        const classItems = currentClass.items.map(it => {
            const sim = simulations.find(s => s.id === it.id);
            return sim ? { ...sim, ...it } : it;
        }).filter(it => it.url);
        const shortcuts = classItems.filter(it => !simulations.some(s => s.id === it.id));
        const classIds = new Set(classItems.map(it => it.id));

        // 주소(#아이디)로 열 수 있는 모든 화면
        const items = [pinnedItem, ...simulations, ...shortcuts];
        const newIds = new Set(simulations.slice(-NEW_COUNT).map(s => s.id));
        // 화면에는 최근에 만든 것부터 보여 준다
        const newestFirst = [...simulations].reverse();

        const homeView = document.getElementById('home-view');
        const simView = document.getElementById('sim-view');
        const cardContainer = document.getElementById('card-container');
        const viewer = document.getElementById('sim-viewer');
        const currentSimTitle = document.getElementById('current-sim-title');
        const searchInput = document.getElementById('search');
        const chipsBox = document.getElementById('chips');
        const emptyMsg = document.getElementById('empty');

        // 숨김/표시 제어를 위한 헤더와 푸터
        const mainHeader = document.getElementById('main-header');
        const mainFooter = document.getElementById('main-footer');

        document.querySelector('.ws-banner').onclick = e => {
            e.preventDefault();
            openSimulation(pinnedItem);
        };

        // --- 목록 그리기 ---
        let activeCat = 'all';

        const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        // 띄어쓰기·가운뎃점은 무시하고 찾는다 ('엘니뇨라니냐', '육분의' 모두 걸리도록)
        const normalize = s => s.toLowerCase().replace(/[\s·,]/g, '');

        function makeCard(sim) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = `card cat-${sim.category}`;
            const badges =
                (sim.tag ? `<span class="badge badge-tag">${escapeHtml(sim.tag)}</span>` : '') +
                (newIds.has(sim.id) ? '<span class="badge badge-new">NEW</span>' : '') +
                (sim.phone ? '<span class="badge badge-phone">📱 폰으로</span>' : '');
            card.innerHTML = `
                <span class="card-icon" aria-hidden="true">${sim.icon}</span>
                <span class="card-text">
                    <span class="card-name">${escapeHtml(sim.name)}${badges}</span>
                    <span class="card-desc">${escapeHtml(sim.desc || '')}</span>
                </span>
                <span class="card-arrow" aria-hidden="true">›</span>`;
            card.onclick = () => openSimulation(sim);
            return card;
        }

        function makeSection(title, list, note, extraClass) {
            const section = document.createElement('section');
            section.className = 'section' + (extraClass ? ' ' + extraClass : '');
            if (title) {
                const head = document.createElement('h2');
                head.className = 'section-head';
                head.innerHTML = `${title} <small>${note ? escapeHtml(note) : list.length}</small>`;
                section.appendChild(head);
            }
            const grid = document.createElement('div');
            grid.className = 'grid';
            list.forEach(sim => grid.appendChild(makeCard(sim)));
            section.appendChild(grid);
            return section;
        }

        function renderChips() {
            const tabs = [{ id: 'all', name: '전체', count: simulations.length },
                ...categories.map(c => ({ ...c, count: [...simulations, ...shortcuts].filter(s => s.category === c.id).length }))
                    .filter(c => c.count > 0)];
            // 찾는 중에는 분류와 상관없이 전부에서 찾으므로 탭 선택을 꺼 둔다
            const searching = normalize(searchInput.value) !== '';
            chipsBox.innerHTML = '';
            tabs.forEach(t => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'chip';
                chip.setAttribute('role', 'tab');
                chip.setAttribute('aria-selected', String(!searching && t.id === activeCat));
                chip.innerHTML = `${t.icon ? t.icon + ' ' : ''}${t.name}<small>${t.count}</small>`;
                chip.onclick = () => {
                    activeCat = t.id;
                    searchInput.value = '';
                    renderChips();
                    renderList();
                };
                chipsBox.appendChild(chip);
            });
        }

        function renderList() {
            const q = normalize(searchInput.value);
            cardContainer.innerHTML = '';

            const inCat = s => q || activeCat === 'all' || s.category === activeCat;
            const matches = s => !q || normalize(`${s.name} ${s.desc || ''}`).includes(q);
            const shown = [...newestFirst, ...shortcuts].filter(s => inCat(s) && matches(s));

            if (q) {
                // 찾는 중에는 묶지 않고 한 덩어리로 보여 준다
                if (shown.length) cardContainer.appendChild(makeSection(`찾은 실험`, shown));
            } else {
                // '전체' 에서는 지금 수업을 맨 위에 모으고, 아래 분류에서는 겹치지 않게 뺀다
                const showClass = activeCat === 'all' && classItems.length > 0;
                if (showClass) {
                    cardContainer.appendChild(makeSection(`📌 ${currentClass.title}`, classItems, currentClass.note, 'section-class'));
                }
                categories.forEach(c => {
                    const list = shown.filter(s => s.category === c.id && !(showClass && classIds.has(s.id)));
                    if (list.length) cardContainer.appendChild(makeSection(`${c.icon} ${c.name}`, list));
                });
            }
            emptyMsg.hidden = shown.length > 0;
        }

        document.getElementById('sim-count').textContent = `실험 ${simulations.length}개`;
        searchInput.addEventListener('input', () => {
            renderChips();
            renderList();
        });
        renderChips();
        renderList();

        // --- 화면 전환 (실제 렌더링) ---
        const HOME_TITLE = document.title;
        let currentUrl = 'about:blank';

        // iframe 의 src 속성을 직접 바꾸면 브라우저 세션 히스토리에 항목이 하나 더 쌓인다.
        // 그러면 뒤로가기가 '목록'이 아니라 'iframe 의 이전 문서'로 가버리므로,
        // 히스토리에 남지 않는 location.replace 로 이동시킨다.
        function setViewerUrl(url) {
            if (currentUrl === url) return;
            currentUrl = url;
            try {
                viewer.contentWindow.location.replace(url);
            } catch (e) {
                viewer.src = url; // 접근이 막히는 환경에서는 원래 방식으로 대체
            }
        }

        function showSim(sim) {
            currentSimTitle.innerText = sim.name;
            setViewerUrl(sim.url);
            document.title = `${sim.name} · ${HOME_TITLE}`;

            // 뷰 전환 (홈 숨기고, 시뮬레이션 보이기)
            homeView.style.display = 'none';
            // 시뮬레이션 진입 시 헤더와 푸터 숨기기
            mainHeader.style.display = 'none'; 
            mainFooter.style.display = 'none'; 
            simView.style.display = 'flex';
        }

        function showHome() {
            setViewerUrl('about:blank'); // 메모리 확보를 위해 iframe 비우기
            document.title = HOME_TITLE;

            // 뷰 전환 (시뮬레이션 숨기고, 홈 보이기)
            simView.style.display = 'none';
            homeView.style.display = 'block';
            // 홈 화면으로 돌아올 때 헤더와 푸터 다시 보이기
            mainHeader.style.display = 'flex'; 
            mainFooter.style.display = 'flex'; 
        }

        // --- 해시 라우팅 ---
        // 주소창의 #아이디가 곧 현재 화면이다. 덕분에
        //  (1) 휴대폰 뒤로가기가 사이트를 벗어나지 않고 목록으로 돌아오고
        //  (2) 특정 시뮬레이션 링크를 그대로 공유할 수 있다.

        // 목록에서 직접 들어온 경우에만 history.back()으로 되돌릴 수 있다.
        // (링크를 타고 시뮬레이션으로 바로 진입했다면 이전 항목은 우리 페이지가 아니다)
        let pushedByUs = false;

        function applyRoute() {
            const id = decodeURIComponent(location.hash.replace(/^#/, ''));
            const sim = items.find(s => s.id === id);
            if (sim) {
                showSim(sim);
            } else {
                pushedByUs = false;
                showHome();
            }
        }

        // 시뮬레이션 열기 함수 (해시만 바꾸고 실제 전환은 applyRoute가 담당)
        function openSimulation(sim) {
            pushedByUs = true;
            location.hash = encodeURIComponent(sim.id);
        }

        // 홈으로 돌아가기 함수
        function goHome() {
            if (pushedByUs) {
                history.back(); // 뒤로가기 버튼과 동작을 일치시킨다
            } else {
                // 딥링크로 바로 진입한 경우: 뒤로 갈 곳이 우리 페이지가 아니므로
                // 히스토리를 늘리지 않고 주소의 해시만 지운다.
                // location.replace 는 문서를 통째로 다시 불러오므로 쓰지 않는다
                // (replaceState 는 hashchange 를 발생시키지 않아 showHome 을 직접 호출한다).
                history.replaceState(null, '', location.pathname + location.search);
                showHome();
            }
        }

        window.addEventListener('hashchange', applyRoute);
        applyRoute(); // 최초 진입 시 주소의 해시를 반영 (딥링크 포함)

        // iOS 등에서 화면 스크롤 시 빈 공간 스크롤 방지 (iframe 내부는 정상 작동)
        document.addEventListener('touchmove', function(e) {
            // 홈 화면 안에서는 스크롤 허용, 그 외(시뮬레이션 화면의 배경 등)는 스크롤 방지
            if (!e.target.closest('#home-view') && !e.target.closest('#sim-viewer')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
    <!-- 세화여고 체육대회 우천 레이더 (날짜는 widgets/sportsday-rain.js 의 EVENT 에서 바꾼다) -->
    <script src="widgets/sportsday-rain.js?v=1"></script>
</body>
</html>
