<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>민규 선생님의 과학 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        /* 전체 페이지 설정: 스크롤 및 바운스 원천 차단 */
        html, body { 
            font-family: 'Noto Sans KR', sans-serif; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
            background-color: #ffffff;
        }

        /* 헤더 영역 최소화 */
        header {
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #e2e8f0;
            background: #fff;
            z-index: 50;
        }

        /* 시뮬레이션 영역: 남은 공간 전체 차지 */
        .sim-container { 
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            /* 아이폰 하단 홈 바 영역 대응 */
            padding-bottom: env(safe-area-inset-bottom);
        }

        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block;
        }

        /* 버튼 스타일 최적화 */
        .btn-sim {
            padding: 6px 12px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s;
        }

        .btn-sim.active {
            background: #4f46e5;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="flex items-center justify-between w-full">
            <h1 class="text-sm font-bold text-indigo-600 truncate mr-4">
                🔬 민규쌤의 과학 실험실
            </h1>
            <div id="sim-menu" class="flex gap-2">
                <!-- 버튼 생성 영역 -->
            </div>
        </div>
    </header>

    <main class="sim-container">
        <!-- 불필요한 내부 카드/창 구조 제거 -->
        <iframe id="sim-viewer" src="about:blank" allow="autoplay; fullscreen" scrolling="no"></iframe>
    </main>

    <script>
        // 현재는 중위도 저기압만 유지
        const simulations = [
            { id: 'cyclone', name: '중위도 저기압', url: 'cyclone.html' }
        ];

        const menuContainer = document.getElementById('sim-menu');
        const viewer = document.getElementById('sim-viewer');

        simulations.forEach(sim => {
            const btn = document.createElement('button');
            btn.className = "btn-sim active:scale-95";
            btn.innerText = sim.name;
            btn.onclick = () => {
                viewer.src = sim.url; 
                
                // 버튼 상태 변경
                Array.from(menuContainer.children).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
            menuContainer.appendChild(btn);
        });

        // 로드 시 자동 실행
        window.addEventListener('load', () => {
            if(simulations.length > 0) {
                setTimeout(() => {
                    const firstBtn = menuContainer.firstElementChild;
                    if (firstBtn) firstBtn.click();
                }, 100);
            }
        });

        // iOS 브라우저 튕김 방지 (iframe 내부는 허용)
        document.addEventListener('touchmove', function(e) {
            if (!e.target.closest('#sim-viewer')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
